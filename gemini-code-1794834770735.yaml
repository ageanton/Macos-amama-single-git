              // MARK: - Numbered Editorial Folio Stream
              private func conversationStreamCanvas(
                  session: ConversationSession,
                  useLeftGutter: Bool,
                  totalRowMaxWidth: CGFloat,
                  horizontalPadding: CGFloat,
                  opticalFontSize: CGFloat,
                  isFullscreenOrWide: Bool
              ) -> some View {
                  let thread = session.activeBranchThread
                  let lastTurnID = thread.last?.id
                  let dynamicBottomClearance = max(124.0, composerMeasuredHeight + 28.0)
                  let jumpButtonBottomOffset = max(92.0, composerMeasuredHeight + 12.0)

                  return ScrollViewReader { proxy in
                      ScrollView(.vertical, showsIndicators: true) {
                          LazyVStack(alignment: .leading, spacing: 26) {
                              ForEach(Array(thread.enumerated()), id: \.element.id) { turnIdx, node in
                                  messageTurnView(
                                      node: node,
                                      turnNumber: turnIdx + 1,
                                      session: session,
                                      isLatestTurn: node.id == lastTurnID,
                                      useLeftGutter: useLeftGutter,
                                      opticalFontSize: opticalFontSize,
                                      isFullscreenOrWide: isFullscreenOrWide
                                  )
                                  .id(node.id)
                              }

                              Color.clear
                                  .frame(height: dynamicBottomClearance)
                                  .id("STREAM_BOTTOM_ANCHOR")
                          }
                          .background(
                              ScrollViewBottomObserver(
                                  isScrolledAwayFromBottom: $store.isScrolledAwayFromBottom,
                                  isDark: tokens.isEffectivelyDark
                              )
                              .frame(width: 1, height: 1)
                          )
                          .frame(maxWidth: totalRowMaxWidth, alignment: .leading)
                          .padding(.horizontal, horizontalPadding)
                          .padding(.top, 24)
                          .frame(maxWidth: .infinity)
                      }
                      .onChange(of: store.streamScrollPulse) { _, _ in
                          if store.isStreamingGeneration && !store.isScrolledAwayFromBottom && !store.isAutoScrollPaused {
                              proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                          }
                      }
                      .onChange(of: store.pendingScrollToMessageID) { _, targetID in
                          if let id = targetID {
                              withAnimation(.spring(response: 0.28, dampingFraction: 0.86)) {
                                  proxy.scrollTo(id, anchor: .center)
                              }
                              store.pendingScrollToMessageID = nil
                          }
                      }
                      .overlay(alignment: .bottom) {
                          if store.isScrolledAwayFromBottom && !store.isComposerCanvasExpanded && store.matchedSlashPersonas.isEmpty {
                              ArchitecturalJumpToLatestButton(tokens: tokens, typo: typo) {
                                  store.isScrolledAwayFromBottom = false
                                  store.isAutoScrollPaused = false
                                  if store.isStreamingGeneration {
                                      proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                                  } else {
                                      withAnimation(.easeOut(duration: 0.18)) {
                                          proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                                      }
                                  }
                              }
                              .padding(.bottom, jumpButtonBottomOffset)
                              .transition(.opacity)
                          }
                      }
                  }
              }

              @ViewBuilder
              private func messageTurnView(
                  node: ConversationMessageNode,
                  turnNumber: Int,
                  session: ConversationSession,
                  isLatestTurn: Bool,
                  useLeftGutter: Bool,
                  opticalFontSize: CGFloat,
                  isFullscreenOrWide: Bool
              ) -> some View {
                  let siblingMeta = session.siblingInfo(for: node.id)
                  let isNodeStreaming = store.isStreamingGeneration && store.streamingNodeID == node.id
                  let isHovered = hoveredTurnNodeID == node.id

                  VStack(alignment: .leading, spacing: 12) {
                      if useLeftGutter {
                          HStack(alignment: .top, spacing: 18) {
                              // Numbered Margin Column (`01 // You` + Living Vertical Margin Rail)
                              VStack(alignment: .leading, spacing: 6) {
                                  Text(String(format: "%02d", turnNumber))
                                      .font(typo.mono(size: 10, weight: .semibold))
                                      .foregroundColor(tokens.mutedText)

                                  turnRoleOrHotSwapMenu(node: node, maxLabelWidth: 112)

                                  if siblingMeta.totalCount > 1 {
                                      branchPaginationControl(nodeID: node.id, siblingMeta: siblingMeta)
                                  }

                                  if isNodeStreaming {
                                      Button("STOP ■") {
                                          store.stopActiveGeneration()
                                      }
                                      .font(typo.mono(size: 9.5, weight: .bold))
                                      .tracking(0.5)
                                      .foregroundColor(tokens.primaryText)
                                      .padding(.horizontal, 7)
                                      .padding(.vertical, 3)
                                      .background(
                                          RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                              .fill(tokens.elevatedSurface)
                                      )
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                              .strokeBorder(tokens.strongBorder, lineWidth: 0.75)
                                      )
                                      .buttonStyle(.plain)
                                  }
                              }
                              .frame(width: 118, alignment: .leading)
                              .clipped()

                              // Vertical 1px Margin Rule
                              Rectangle()
                                  .fill(isNodeStreaming ? tokens.primaryText : tokens.hairline)
                                  .frame(width: isNodeStreaming ? 1.5 : 1.0)

                              VStack(alignment: .leading, spacing: 10) {
                                  turnMainBody(
                                      node: node,
                                      isNodeStreaming: isNodeStreaming,
                                      opticalFontSize: opticalFontSize,
                                      isFullscreenOrWide: isFullscreenOrWide
                                  )
                                  turnBottomActionBar(
                                      node: node,
                                      session: session,
                                      isLatestTurn: isLatestTurn,
                                      isNodeStreaming: isNodeStreaming,
                                      isTurnHovered: isHovered
                                  )
                              }
                              .frame(maxWidth: .infinity, alignment: .leading)
                          }
                      } else {
                          HStack(alignment: .center, spacing: 8) {
                              Text(String(format: "%02d //", turnNumber))
                                  .font(typo.mono(size: 10, weight: .semibold))
                                  .foregroundColor(tokens.mutedText)

                              turnRoleOrHotSwapMenu(node: node, maxLabelWidth: 200)

                              if siblingMeta.totalCount > 1 {
                                  branchPaginationControl(nodeID: node.id, siblingMeta: siblingMeta)
                              }

                              Spacer()

                              if isNodeStreaming {
                                  Button("STOP ■") {
                                      store.stopActiveGeneration()
                                  }
                                  .font(typo.mono(size: 9.5, weight: .bold))
                                  .foregroundColor(tokens.primaryText)
                                  .buttonStyle(.plain)
                              }
                          }

                          turnMainBody(
                              node: node,
                              isNodeStreaming: isNodeStreaming,
                              opticalFontSize: opticalFontSize,
                              isFullscreenOrWide: isFullscreenOrWide
                          )
                          turnBottomActionBar(
                              node: node,
                              session: session,
                              isLatestTurn: isLatestTurn,
                              isNodeStreaming: isNodeStreaming,
                              isTurnHovered: isHovered
                          )
                      }

                      HairlineDivider(tokens: tokens)
                          .padding(.top, 6)
                  }
                  .contentShape(Rectangle())
                  .onHover { hovering in
                      hoveredTurnNodeID = hovering ? node.id : (hoveredTurnNodeID == node.id ? nil : hoveredTurnNodeID)
                  }
                  .contextMenu {
                      Button("Copy Text") {
                          NSPasteboard.general.clearContents()
                          NSPasteboard.general.setString(node.content.isEmpty ? node.thinkingTrace : node.content, forType: .string)
                      }
                      Button(node.role == .user ? "Edit Prompt…" : "Edit / Trim Reply…") {
                          editMessageDraft = node.content
                          clearThinkingOnAssistantEdit = false
                          isEditBoxExpandedFull = false
                          editingMessageNodeID = node.id
                      }
                      Button("Fork to New Folio from Here") {
                          store.branchMessageToNewChat(upToNodeID: node.id)
                      }
                      Divider()
                      Button("Delete Entry (Free ~\(node.estimatedTokenFootprint) tok)…", role: .destructive) {
                          confirmingDeleteNodeID = node.id
                      }
                  }
              }

              @ViewBuilder
              private func turnRoleOrHotSwapMenu(node: ConversationMessageNode, maxLabelWidth: CGFloat) -> some View {
                  if node.role == .user {
                      Text("You")
                          .font(typo.display(size: 13, weight: .semibold, italic: true))
                          .foregroundColor(tokens.primaryText)
                  } else {
                      let rawModel = node.modelUsed.isEmpty ? "Assistant" : node.modelUsed
                      let shortLabel = LocalModelDescriptor.shortenModelName(rawModel)

                      Menu {
                          Text("Regenerate entry with model:")
                          ForEach(store.availableModels) { model in
                              Button(model.shortDisplayName) {
                                  store.regenerateAssistantBranch(forAssistantNodeID: node.id, withOverrideModel: model.name)
                              }
                          }
                      } label: {
                          HStack(spacing: 4) {
                              Text(shortLabel)
                                  .font(typo.display(size: 13, weight: .semibold))
                                  .foregroundColor(tokens.primaryText)
                                  .lineLimit(1)
                                  .truncationMode(.tail)
                              Text("▾")
                                  .font(typo.mono(size: 9))
                                  .foregroundColor(tokens.mutedText)
                          }
                          .frame(maxWidth: maxLabelWidth, alignment: .leading)
                      }
                      .menuStyle(.borderlessButton)
                      .frame(maxWidth: maxLabelWidth, alignment: .leading)
                      .help("\(shortLabel) — Hot-swap model and regenerate this entry")
                  }
              }

              private func branchPaginationControl(nodeID: UUID, siblingMeta: (currentIndex: Int, totalCount: Int)) -> some View {
                  HStack(spacing: 1) {
                      Button {
                          store.switchBranchVersion(forNodeID: nodeID, delta: -1)
                      } label: {
                          Text("‹")
                              .font(typo.mono(size: 11, weight: .bold))
                              .frame(width: 18, height: 18)
                              .contentShape(Rectangle())
                      }
                      .buttonStyle(.plain)
                      .disabled(siblingMeta.currentIndex == 0)
                      .opacity(siblingMeta.currentIndex == 0 ? 0.35 : 1.0)

                      Text("\(siblingMeta.currentIndex + 1)/\(siblingMeta.totalCount)")
                          .font(typo.mono(size: 9.5, weight: .medium))

                      Button {
                          store.switchBranchVersion(forNodeID: nodeID, delta: 1)
                      } label: {
                          Text("›")
                              .font(typo.mono(size: 11, weight: .bold))
                              .frame(width: 18, height: 18)
                              .contentShape(Rectangle())
                      }
                      .buttonStyle(.plain)
                      .disabled(siblingMeta.currentIndex >= siblingMeta.totalCount - 1)
                      .opacity(siblingMeta.currentIndex >= siblingMeta.totalCount - 1 ? 0.35 : 1.0)
                  }
                  .foregroundColor(tokens.secondaryText)
                  .padding(.horizontal, 2)
                  .frame(height: 20)
                  .background(
                      RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                          .fill(tokens.elevatedSurface)
                  )
                  .overlay(
                      RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                          .strokeBorder(tokens.hairline, lineWidth: 0.75)
                  )
              }

              @ViewBuilder
              private func turnMainBody(
                  node: ConversationMessageNode,
                  isNodeStreaming: Bool,
                  opticalFontSize: CGFloat,
                  isFullscreenOrWide: Bool
              ) -> some View {
                  if !node.attachments.isEmpty {
                      HStack(spacing: 8) {
                          ForEach(node.attachments) { att in
                              Text("DOC // \(att.title) · \(att.formattedByteSize) · ~\(att.tokenEstimate) TOK")
                                  .font(typo.mono(size: 10, weight: .medium))
                                  .foregroundColor(tokens.primaryText)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 4)
                                  .background(tokens.elevatedSurface)
                                  .clipShape(RoundedRectangle(cornerRadius: 3, style: .continuous))
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 3, style: .continuous)
                                          .strokeBorder(tokens.hairline, lineWidth: 0.75)
                                  )
                          }
                      }
                  }

                  if !node.thinkingTrace.isEmpty || (!node.isThinkingComplete && isNodeStreaming) {
                      thinkingDisclosureView(for: node, isStreaming: isNodeStreaming, opticalFontSize: opticalFontSize)
                  }

                  if editingMessageNodeID == node.id {
                      let approxLines = max(6, editMessageDraft.components(separatedBy: .newlines).reduce(0) { $0 + max(1, ($1.count / 72) + 1) })
                      let naturalEditorHeight = CGFloat(approxLines) * (opticalFontSize * 1.55) + 36.0
                      let maxStandardHeight: CGFloat = isFullscreenOrWide ? 660.0 : 480.0
                      let editorHeight: CGFloat = isEditBoxExpandedFull
                          ? min(940.0, max(maxStandardHeight, naturalEditorHeight))
                          : min(maxStandardHeight, max(180.0, naturalEditorHeight))

                      VStack(alignment: .leading, spacing: 8) {
                          HStack {
                              Text(node.role == .user ? "EDITING PROMPT" : "EDITING REPLY (TRIM TEXT TO FREE KV CACHE)")
                                  .font(typo.mono(size: 10, weight: .semibold))
                                  .tracking(0.6)
                                  .foregroundColor(tokens.secondaryText)

                              Spacer()

                              ArchitecturalKeyButton(isEditBoxExpandedFull ? "STANDARD HEIGHT" : "FULL HEIGHT", tokens: tokens, typo: typo) {
                                  withAnimation(.easeOut(duration: 0.14)) {
                                      isEditBoxExpandedFull.toggle()
                                  }
                              }
                          }

                          MotifStyledTextEditor(
                              text: $editMessageDraft,
                              font: typo.nsFont(size: opticalFontSize),
                              tokens: tokens
                          )
                          .frame(height: editorHeight)
                          .padding(8)
                          .background(tokens.elevatedSurface)
                          .clipShape(RoundedRectangle(cornerRadius: 3.5, style: .continuous))
                          .overlay(
                              RoundedRectangle(cornerRadius: 3.5, style: .continuous)
                                  .strokeBorder(tokens.strongBorder, lineWidth: 0.75)
                          )

                          HStack(spacing: 12) {
                              if node.role == .assistant {
                                  if !node.thinkingTrace.isEmpty {
                                      Toggle("Hide stored thought process box", isOn: $clearThinkingOnAssistantEdit)
                                          .font(typo.sans(size: 11.5))
                                          .foregroundColor(tokens.secondaryText)
                                  }
                                  let oldTok = max(1, node.content.count / 4)
                                  let newTok = max(1, editMessageDraft.count / 4)
                                  let savedTok = max(0, oldTok - newTok)
                                  if savedTok > 0 {
                                      Text("SAVES ~\(savedTok) KV TOK")
                                          .font(typo.mono(size: 10, weight: .semibold))
                                          .foregroundColor(tokens.primaryText)
                                  }
                              }

                              Spacer()

                              ArchitecturalKeyButton("CANCEL", tokens: tokens, typo: typo) {
                                  editingMessageNodeID = nil
                              }

                              if node.role == .user {
                                  ArchitecturalKeyButton("SAVE & RESUBMIT", isPrimaryStamp: true, tokens: tokens, typo: typo) {
                                      let updated = editMessageDraft
                                      editingMessageNodeID = nil
                                      store.createEditedMessageBranch(originalNodeID: node.id, updatedText: updated)
                                  }
                              } else {
                                  ArchitecturalKeyButton("SAVE TRIMMED REPLY", isPrimaryStamp: true, tokens: tokens, typo: typo) {
                                      let updated = editMessageDraft
                                      let clearThink = clearThinkingOnAssistantEdit
                                      editingMessageNodeID = nil
                                      store.updateAssistantMessageInPlace(nodeID: node.id, updatedText: updated, clearThinking: clearThink)
                                  }
                              }
                          }
                      }
                  } else if node.content.isEmpty && isNodeStreaming {
                      if store.isLoadingModelWeights {
                          let snap = store.memorySnapshot
                          let pct = Int(snap.loadProgressAgainstTarget * 100.0)
                          let targetGB = max(0.1, snap.targetModelGB)
                          let allocatedGB = min(targetGB, max(snap.weightsGB, snap.activeRAMDeltaGB))
                          Text(String(format: "Mapping weights into Unified Memory (%.1f / %.1f GB · %d%%)…", allocatedGB, targetGB, pct))
                              .font(typo.mono(size: 11))
                              .foregroundColor(tokens.mutedText)
                      } else if node.thinkingTrace.isEmpty {
                          Text("Composing…")
                              .font(typo.display(size: opticalFontSize, italic: true))
                              .foregroundColor(tokens.mutedText)
                      }
                  } else if !node.content.isEmpty {
                      StreamSafeMarkdownView(
                          rawMarkdown: isNodeStreaming ? (node.content + " ▍") : node.content,
                          isStreaming: isNodeStreaming,
                          effectiveFontSize: opticalFontSize,
                          tokens: tokens,
                          typo: typo,
                          onOpenCodeInInspector: { _, _ in
                              store.openStudioLedger(tab: .code)
                          }
                      )
                  }

                  if let err = node.errorNote {
                      Text(err)
                          .font(typo.sans(size: 12))
                          .foregroundColor(tokens.primaryText)
                          .padding(8)
                          .background(tokens.elevatedSurface)
                          .overlay(RoundedRectangle(cornerRadius: 3).strokeBorder(tokens.strongBorder, lineWidth: 0.75))
                  }
              }

              // MARK: - Quiet Hover-Reveal Footnotes & Split Thinking/Answer Telemetry
              @ViewBuilder
              private func turnBottomActionBar(
                  node: ConversationMessageNode,
                  session: ConversationSession,
                  isLatestTurn: Bool,
                  isNodeStreaming: Bool,
                  isTurnHovered: Bool
              ) -> some View {
                  let showFootnoteControls = isTurnHovered || isLatestTurn || confirmingDeleteNodeID == node.id

                  HStack(spacing: 12) {
                      if isNodeStreaming {
                          let isCurrentlyInThinkingPhase = !node.isThinkingComplete && node.content.isEmpty
                          if store.liveTokensPerSec > 0 || store.liveTotalTokens > 0 || store.liveThinkingTokens > 0 {
                              HStack(spacing: 6) {
                                  Rectangle()
                                      .fill(tokens.primaryText)
                                      .frame(width: 4.5, height: 4.5)
                                  if isCurrentlyInThinkingPhase {
                                      Text(String(format: "%.1f TOK/S · %d THINKING TOK", store.liveTokensPerSec, max(1, store.liveThinkingTokens)))
                                          .font(typo.mono(size: 10, weight: .medium))
                                          .foregroundColor(tokens.secondaryText)
                                  } else {
                                      Text(String(format: "%.1f TOK/S · %d TOK", store.liveTokensPerSec, max(1, store.liveTotalTokens)))
                                          .font(typo.mono(size: 10, weight: .medium))
                                          .foregroundColor(tokens.secondaryText)
                                  }
                              }
                          } else {
                              Text("INITIALIZING STREAM…")
                                  .font(typo.mono(size: 9.5))
                                  .foregroundColor(tokens.mutedText)
                          }

                          Spacer()

                          Text("FOLIO TOTAL: \(session.estimatedActiveTokens) TOK")
                              .font(typo.mono(size: 10, weight: .medium))
                              .foregroundColor(tokens.mutedText)
                      } else {
                          if confirmingDeleteNodeID == node.id {
                              HStack(spacing: 8) {
                                  Text("DELETE ENTRY & FREE ~\(node.estimatedTokenFootprint) TOK?")
                                      .font(typo.mono(size: 9.5, weight: .semibold))
                                      .foregroundColor(tokens.primaryText)

                                  ArchitecturalKeyButton("CONFIRM", isPrimaryStamp: true, tokens: tokens, typo: typo) {
                                      confirmingDeleteNodeID = nil
                                      store.deleteSingleMessageNode(node.id)
                                  }

                                  Button("CANCEL") {
                                      confirmingDeleteNodeID = nil
                                  }
                                  .font(typo.mono(size: 9.5))
                                  .foregroundColor(tokens.secondaryText)
                                  .buttonStyle(.plain)
                              }
                          } else if showFootnoteControls {
                              HStack(spacing: 12) {
                                  Button(copiedMessageID == node.id ? "COPIED" : "COPY") {
                                      NSPasteboard.general.clearContents()
                                      NSPasteboard.general.setString(node.content.isEmpty ? node.thinkingTrace : node.content, forType: .string)
                                      copiedMessageID = node.id
                                      DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                          if copiedMessageID == node.id { copiedMessageID = nil }
                                      }
                                  }
                                  .font(typo.mono(size: 9.5, weight: .medium))
                                  .tracking(0.5)
                                  .foregroundColor(tokens.secondaryText)
                                  .buttonStyle(.plain)

                                  Button("EDIT") {
                                      editMessageDraft = node.content
                                      clearThinkingOnAssistantEdit = false
                                      isEditBoxExpandedFull = false
                                      editingMessageNodeID = node.id
                                  }
                                  .font(typo.mono(size: 9.5, weight: .medium))
                                  .tracking(0.5)
                                  .foregroundColor(tokens.secondaryText)
                                  .buttonStyle(.plain)

                                  if node.role == .user && node.childrenIDs.isEmpty {
                                      Button("GENERATE REPLY") {
                                          store.regenerateOrAnswerUserNode(nodeID: node.id)
                                      }
                                      .font(typo.mono(size: 9.5, weight: .bold))
                                      .tracking(0.5)
                                      .foregroundColor(tokens.primaryText)
                                      .buttonStyle(.plain)
                                  }

                                  if node.role == .assistant {
                                      Button("REDO") {
                                          store.regenerateAssistantBranch(forAssistantNodeID: node.id)
                                      }
                                      .font(typo.mono(size: 9.5, weight: .medium))
                                      .tracking(0.5)
                                      .foregroundColor(tokens.secondaryText)
                                      .buttonStyle(.plain)

                                      if node.wasStoppedMidStream && isLatestTurn {
                                          ArchitecturalKeyButton("CONTINUE ▶", isPrimaryStamp: true, tokens: tokens, typo: typo) {
                                              store.continueStoppedGeneration(forAssistantNodeID: node.id)
                                          }
                                      }
                                  }

                                  Button("FORK") {
                                      store.branchMessageToNewChat(upToNodeID: node.id)
                                  }
                                  .font(typo.mono(size: 9.5, weight: .medium))
                                  .tracking(0.5)
                                  .foregroundColor(tokens.secondaryText)
                                  .buttonStyle(.plain)

                                  Button("DELETE") {
                                      confirmingDeleteNodeID = node.id
                                  }
                                  .font(typo.mono(size: 9.5, weight: .medium))
                                  .tracking(0.5)
                                  .foregroundColor(tokens.mutedText)
                                  .buttonStyle(.plain)
                              }
                              .transition(.opacity)
                          }

                          Spacer()

                          let answerOnlyTok = node.role == .assistant
                              ? (node.content.isEmpty ? 0 : max(node.estimatedTokenFootprint, node.metrics?.totalTokens ?? 0))
                              : node.estimatedTokenFootprint
                          let tps = node.metrics?.tokensPerSecond ?? 0.0

                          if node.role == .user {
                              if isLatestTurn {
                                  Text("~\(answerOnlyTok) TOK · FOLIO TOTAL: \(session.estimatedActiveTokens) TOK")
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              } else {
                                  Text("~\(answerOnlyTok) TOK")
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              }
                          } else if isLatestTurn {
                              if tps > 0 {
                                  Text(String(format: "%.1f TOK/S · %d TOK · FOLIO TOTAL: %d TOK", tps, answerOnlyTok, session.estimatedActiveTokens))
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              } else {
                                  Text("~\(answerOnlyTok) TOK · FOLIO TOTAL: \(session.estimatedActiveTokens) TOK")
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              }
                          } else {
                              if tps > 0 {
                                  Text(String(format: "%.1f TOK/S · %d TOK", tps, answerOnlyTok))
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              } else {
                                  Text("~\(answerOnlyTok) TOK")
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              }
                          }
                      }
                  }
                  .frame(height: 22)
                  .padding(.top, 2)
              }

              // MARK: - Drafting Vellum Thought Process Box (`§ Thought Process`)
              @ViewBuilder
              private func thinkingDisclosureView(
                  for node: ConversationMessageNode,
                  isStreaming: Bool,
                  opticalFontSize: CGFloat
              ) -> some View {
                  let relativeThinkingFontSize = max(10.5, opticalFontSize - 2.3)
                  let headerFontSize = max(10.0, opticalFontSize - 3.2)
                  let wordCount = max(1, node.thinkingTrace.split { $0.isWhitespace || $0.isNewline }.count)
                  let isActivelyThinking = !node.isThinkingComplete && isStreaming
                  let thinkTokCount = isActivelyThinking
                      ? max(store.liveThinkingTokens, node.thinkingTrace.count / 4)
                      : max(node.metrics?.thinkingTokens ?? 0, node.thinkingTrace.count / 4)

                  VStack(alignment: .leading, spacing: 5) {
                      Button {
                          guard let sIdx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }),
                                var target = store.sessions[sIdx].nodes[node.id] else { return }
                          withAnimation(.easeOut(duration: 0.14)) {
                              target.isThinkingExpanded.toggle()
                              store.sessions[sIdx].nodes[node.id] = target
                          }
                      } label: {
                          HStack(spacing: 8) {
                              Text("§")
                                  .font(typo.display(size: headerFontSize + 1.5, weight: .semibold, italic: true))
                                  .foregroundColor(tokens.thinkingText)

                              Text(node.wasStoppedMidThinking ? "THOUGHT PROCESS · STOPPED" : (isActivelyThinking ? "THINKING LIVE" : "THOUGHT PROCESS"))
                                  .font(typo.mono(size: headerFontSize, weight: .semibold))
                                  .tracking(0.6)
                                  .foregroundColor(tokens.thinkingText)

                              Text(node.isThinkingComplete
                                   ? String(format: "%.1fs", node.metrics?.thinkingDurationSec ?? 0.0)
                                   : String(format: "%.1fs…", store.liveElapsedSeconds))
                                  .font(typo.mono(size: headerFontSize))
                                  .foregroundColor(tokens.thinkingText.opacity(0.75))

                              if !node.thinkingTrace.isEmpty {
                                  Text("· \(wordCount)w (~\(max(1, thinkTokCount)) tok)")
                                      .font(typo.mono(size: headerFontSize))
                                      .foregroundColor(tokens.thinkingText.opacity(0.65))
                              }

                              Text(node.isThinkingExpanded ? "▾" : "▸")
                                  .font(typo.mono(size: 10))
                                  .foregroundColor(tokens.thinkingText.opacity(0.75))
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 5)
                          .background(tokens.thinkingSurface)
                          .clipShape(RoundedRectangle(cornerRadius: 3, style: .continuous))
                          .overlay(
                              RoundedRectangle(cornerRadius: 3, style: .continuous)
                                  .strokeBorder(tokens.hairline, lineWidth: 0.75)
                          )
                      }
                      .buttonStyle(.plain)

                      if node.isThinkingExpanded {
                          StreamSafeMarkdownView(
                              rawMarkdown: node.thinkingTrace.isEmpty ? "Deliberating…" : node.thinkingTrace,
                              isStreaming: isActivelyThinking,
                              effectiveFontSize: relativeThinkingFontSize,
                              tokens: tokens,
                              typo: typo,
                              useMonospaceBody: true,
                              overrideTextColor: tokens.thinkingText,
                              onOpenCodeInInspector: { _, _ in
                                  store.openStudioLedger(tab: .code)
                              }
                          )
                          .padding(12)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .background(tokens.thinkingSurface)
                          .clipShape(RoundedRectangle(cornerRadius: 3, style: .continuous))
                          .overlay(
                              RoundedRectangle(cornerRadius: 3, style: .continuous)
                                  .strokeBorder(tokens.hairline, lineWidth: 0.75)
                          )
                      }
                  }
                  .padding(.bottom, 2)
              }
          }

          // MARK: - Architectural Drafting Plinth (Rectilinear 3.5pt Composer with Integrated Attachment Manifest)
          public struct ArchitecturalDraftingPlinth: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: MotifTokens
              public var maxBarWidth: CGFloat = 760.0
              public var activeFontSize: CGFloat = 14.0
              public var isWideOrFullscreen: Bool = false

              @State private var isComposerFocused: Bool = false
              @State private var compactEditorHeight: CGFloat = 28.0
              @State private var wrappedLineCount: Int = 1

              private var typo: TypographyConfiguration { store.typography }

              private var isSendEnabled: Bool {
                  store.isStreamingGeneration || store.sendDisabledReason == nil
              }

              private var matchingPersonas: [SlashPersona] {
                  store.matchedSlashPersonas
              }

              private var effectiveEditorHeight: CGFloat {
                  store.isComposerCanvasExpanded ? 230.0 : compactEditorHeight
              }

              private var adaptivePlaceholder: String {
                  isWideOrFullscreen
                      ? "Compose entry…  (Type / for personas · Shift+Return for new line)"
                      : "Compose entry…  (/ for personas)"
              }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      if !matchingPersonas.isEmpty {
                          SlashPersonaCommandPaletteCard(
                              personas: matchingPersonas,
                              highlightedIndex: min(max(0, store.slashMenuHighlightedIndex), max(0, matchingPersonas.count - 1)),
                              tokens: tokens,
                              typo: typo,
                              onSelect: { persona in
                                  store.applySlashPersona(persona)
                              },
                              onManagePersonas: {
                                  store.isSlashMenuDismissedForCurrentToken = true
                                  store.settingsRequestedSection = "03 // PERSONAS"
                                  store.isSettingsViewActive = true
                              },
                              onDismiss: {
                                  store.isSlashMenuDismissedForCurrentToken = true
                              }
                          )
                          .frame(maxWidth: min(maxBarWidth, 500))
                      }

                      VStack(alignment: .leading, spacing: 0) {
                          // Integrated Attachment Manifest Strip Inside the Top of the Plinth
                          if !store.pendingAttachments.isEmpty {
                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 8) {
                                      ForEach(store.pendingAttachments.indices, id: \.self) { idx in
                                          let chip = store.pendingAttachments[idx]
                                          HStack(spacing: 6) {
                                              Text(chip.kind == .downscaledVisionImage ? "IMG //" : "DOC //")
                                                  .font(typo.mono(size: 9.5, weight: .semibold))
                                                  .foregroundColor(tokens.mutedText)
                                              Text("\(chip.title) (\(chip.formattedByteSize) · ~\(chip.tokenEstimate) tok)")
                                                  .font(typo.mono(size: 10))
                                                  .foregroundColor(tokens.primaryText)
                                              Button {
                                                  store.pendingAttachments.remove(at: idx)
                                              } label: {
                                                  Text("×")
                                                      .font(typo.mono(size: 11, weight: .bold))
                                                      .foregroundColor(tokens.secondaryText)
                                              }
                                              .buttonStyle(.plain)
                                          }
                                          .padding(.horizontal, 8)
                                          .padding(.vertical, 4)
                                          .background(tokens.elevatedSurface)
                                          .clipShape(RoundedRectangle(cornerRadius: 2.5, style: .continuous))
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                                  .strokeBorder(tokens.hairline, lineWidth: 0.75)
                                          )
                                      }
                                  }
                                  .padding(.horizontal, 12)
                                  .padding(.vertical, 7)
                              }

                              HairlineDivider(tokens: tokens)
                          }

                          // Deck A: Full-Width Drafting Field + Expand/Contract Canvas Key
                          HStack(alignment: .top, spacing: 6) {
                              IMESafeComposerTextView(
                                  text: Binding(
                                      get: { store.composerDraft },
                                      set: { store.handleTextInputOrPaste($0) }
                                  ),
                                  isFocused: $isComposerFocused,
                                  compactHeight: $compactEditorHeight,
                                  lineCount: $wrappedLineCount,
                                  placeholder: adaptivePlaceholder,
                                  tokens: tokens,
                                  typo: typo,
                                  fontSize: activeFontSize,
                                  isSlashMenuVisible: !matchingPersonas.isEmpty,
                                  onSend: {
                                      if !store.isStreamingGeneration && store.sendDisabledReason == nil {
                                          store.sendActivePrompt()
                                      }
                                  },
                                  onSlashMoveUp: { store.moveSlashSelection(delta: -1) },
                                  onSlashMoveDown: { store.moveSlashSelection(delta: 1) },
                                  onSlashConfirm: { store.applyHighlightedSlashPersona() },
                                  onSlashDismiss: { store.isSlashMenuDismissedForCurrentToken = true },
                                  onLargePaste: { pasted in store.handleTextInputOrPaste(pasted) }
                              )
                              .frame(height: effectiveEditorHeight)

                              Button {
                                  withAnimation(.easeOut(duration: 0.14)) {
                                      store.isComposerCanvasExpanded.toggle()
                                  }
                              } label: {
                                  Image(systemName: store.isComposerCanvasExpanded
                                        ? "arrow.down.right.and.arrow.up.left"
                                        : "arrow.up.left.and.arrow.down.right")
                                      .font(.system(size: 10, weight: .semibold))
                                      .foregroundColor(store.isComposerCanvasExpanded ? tokens.primaryText : tokens.mutedText)
                                      .frame(width: 22, height: 22)
                                      .background(
                                          RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                              .fill(tokens.elevatedSurface.opacity(0.75))
                                      )
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                              .strokeBorder(tokens.hairline, lineWidth: 0.75)
                                      )
                              }
                              .buttonStyle(.plain)
                              .padding(.top, 2)
                              .help(store.isComposerCanvasExpanded ? "Restore compact height" : "Expand drafting sheet")
                          }
                          .padding(.horizontal, 12)
                          .padding(.top, 8)
                          .padding(.bottom, 5)

                          HairlineDivider(tokens: tokens)

                          // Deck B: Flush Architectural Key Bar
                          HStack(alignment: .center, spacing: 8) {
                              ArchitecturalKeyButton("+ FILE", tokens: tokens, typo: typo) {
                                  attachLocalFileOrVisionAsset()
                              }

                              if let activeTrigger = store.activeSession?.activePersonaTrigger {
                                  HStack(spacing: 5) {
                                      Text(activeTrigger.uppercased())
                                          .font(typo.mono(size: 9.5, weight: .semibold))
                                          .foregroundColor(tokens.primaryText)
                                      Button("×") {
                                          if let idx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }) {
                                              store.sessions[idx].activePersonaTrigger = nil
                                              store.saveAllState()
                                          }
                                      }
                                      .font(typo.mono(size: 10, weight: .bold))
                                      .foregroundColor(tokens.mutedText)
                                      .buttonStyle(.plain)
                                  }
                                  .padding(.horizontal, 8)
                                  .frame(height: 25)
                                  .background(
                                      RoundedRectangle(cornerRadius: 3, style: .continuous)
                                          .fill(tokens.selectionPill)
                                  )
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 3, style: .continuous)
                                          .strokeBorder(tokens.hairline, lineWidth: 0.75)
                                  )
                              }

                              if !store.composerDraft.isEmpty {
                                  Text("\(wrappedLineCount)L · ~\(max(1, store.composerDraft.count / 4)) TOK")
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.mutedText)
                              }

                              Spacer()

                              if !store.isStudioLedgerVisible {
                                  ArchitecturalKeyButton("STUDIO", tokens: tokens, typo: typo) {
                                      store.openStudioLedger(tab: .studio)
                                  }
                              }

                              ArchitecturalKeyButton(
                                  store.isStreamingGeneration ? "STOP ■" : "SEND ↵",
                                  isPrimaryStamp: true,
                                  isDisabled: !isSendEnabled,
                                  tokens: tokens,
                                  typo: typo
                              ) {
                                  if store.isStreamingGeneration {
                                      store.stopActiveGeneration()
                                  } else {
                                      store.sendActivePrompt()
                                  }
                              }
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 6)
                          .background(tokens.elevatedSurface.opacity(0.45))
                      }
                      .background(tokens.canvasBackground)
                      .clipShape(RoundedRectangle(cornerRadius: 3.5, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: 3.5, style: .continuous)
                              .strokeBorder(isComposerFocused ? tokens.strongBorder : tokens.hairline, lineWidth: 0.75)
                      )
                      .shadow(
                          color: Color.black.opacity(tokens.isEffectivelyDark ? 0.28 : 0.045),
                          radius: 12,
                          y: 4
                      )
                  }
                  .frame(maxWidth: maxBarWidth)
              }

              private func attachLocalFileOrVisionAsset() {
                  let panel = NSOpenPanel()
                  panel.title = "Attach Document or Image"
                  panel.allowsMultipleSelection = true
                  panel.canChooseDirectories = false
                  if panel.runModal() == .OK {
                      store.attachFilesFromURLs(panel.urls)
                  }
              }
          }

          // MARK: - Rectilinear Slash Command Palette
          public struct SlashPersonaCommandPaletteCard: View {
              public let personas: [SlashPersona]
              public let highlightedIndex: Int
              public let tokens: MotifTokens
              public let typo: TypographyConfiguration
              public let onSelect: (SlashPersona) -> Void
              public let onManagePersonas: () -> Void
              public let onDismiss: () -> Void

              public var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      HStack(spacing: 8) {
                          Text("SLASH PERSONAS")
                              .font(typo.mono(size: 9.5, weight: .semibold))
                              .tracking(0.8)
                              .foregroundColor(tokens.mutedText)

                          Spacer()

                          Text("↑↓ · ↵ APPLY · ESC")
                              .font(typo.mono(size: 9))
                              .foregroundColor(tokens.mutedText)

                          Button("×", action: onDismiss)
                              .font(typo.mono(size: 11, weight: .semibold))

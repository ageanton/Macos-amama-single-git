                                              key: ComposerHeightPreferenceKey.self,
                                              value: compGeo.size.height
                                          )
                                      }
                                  )
                              }
                              .onPreferenceChange(ComposerHeightPreferenceKey.self) { newH in
                                  if abs(composerMeasuredHeight - newH) > 1.0 {
                                      composerMeasuredHeight = newH
                                  }
                              }
                          } else {

name: Build BlackMotif macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "BlackMotif"
  DISPLAY_NAME: "BlackMotif"
  BUNDLE_ID: "com.blackmotif.studio.macos"
  VERSION: "1.0.0"
  BUILD_NUMBER: "100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 BlackMotif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon Runner & Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Create Project Directory Structure & Bundle Verified Editorial Fonts
        run: |
          set -e
          mkdir -p BlackMotif/Sources/BlackMotif/Models
          mkdir -p BlackMotif/Sources/BlackMotif/Engine
          mkdir -p BlackMotif/Sources/BlackMotif/Services
          mkdir -p BlackMotif/Sources/BlackMotif/Views
          mkdir -p BlackMotif/Sources/BlackMotif/Components
          mkdir -p BlackMotif/Sources/BlackMotif/Resources/Fonts
          mkdir -p build/dmg_staging
          mkdir -p build/AppIcon.iconset

          download_font() {
            local url="$1"
            local dest="$2"
            if curl -fsSL "$url" -o "$dest"; then
              local size
              size=$(wc -c < "$dest" | tr -d ' ')
              if [ "$size" -lt 10000 ]; then
                rm -f "$dest"
              fi
            else
              rm -f "$dest"
            fi
          }

          download_font "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            "BlackMotif/Sources/BlackMotif/Resources/Fonts/PlusJakartaSans-Variable.ttf"
          download_font "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "BlackMotif/Sources/BlackMotif/Resources/Fonts/Inter-Variable.ttf"
          download_font "https://github.com/google/fonts/raw/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf" \
            "BlackMotif/Sources/BlackMotif/Resources/Fonts/OpenSans-Variable.ttf"
          download_font "https://github.com/google/fonts/raw/main/ofl/geist/Geist%5Bwght%5D.ttf" \
            "BlackMotif/Sources/BlackMotif/Resources/Fonts/Geist-Variable.ttf"
          download_font "https://github.com/google/fonts/raw/main/ofl/newsreader/Newsreader%5Bopsz,wght%5D.ttf" \
            "BlackMotif/Sources/BlackMotif/Resources/Fonts/Newsreader-Variable.ttf"

      - name: Generate Programmatic Architectural Squircle AppIcon.icns
        run: |
          cat << 'EOF' > build/generate_icon.swift
          import AppKit
          import CoreGraphics

          func renderBlackMotifIcon(size: Int) -> Data? {
              let rep = NSBitmapImageRep(
                  bitmapDataPlanes: nil,
                  pixelsWide: size,
                  pixelsHigh: size,
                  bitsPerSample: 8,
                  samplesPerPixel: 4,
                  hasAlpha: true,
                  isPlanar: false,
                  colorSpaceName: .deviceRGB,
                  bytesPerRow: 0,
                  bitsPerPixel: 0
              )!
              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
              guard let ctx = NSGraphicsContext.current?.cgContext else { return nil }

              let s = CGFloat(size)
              let inset = s * 0.085
              let rect = CGRect(x: inset, y: inset, width: s - inset * 2, height: s - inset * 2)
              let cornerRadius = rect.width * 0.225

              let squircle = NSBezierPath(roundedRect: rect, xRadius: cornerRadius, yRadius: cornerRadius)
              ctx.saveGState()
              squircle.addClip()

              // Muted Carbon architectural substrate
              let colorSpace = CGColorSpaceCreateDeviceRGB()
              let gradColors = [
                  CGColor(red: 0.135, green: 0.135, blue: 0.130, alpha: 1.0),
                  CGColor(red: 0.082, green: 0.082, blue: 0.078, alpha: 1.0)
              ] as CFArray
              if let gradient = CGGradient(colorsSpace: colorSpace, colors: gradColors, locations: [0.0, 1.0]) {
                  ctx.drawLinearGradient(
                      gradient,
                      start: CGPoint(x: s * 0.5, y: s - inset),
                      end: CGPoint(x: s * 0.5, y: inset),
                      options: []
                  )
              }

              // Subtle Swiss architectural grid rules
              ctx.setStrokeColor(CGColor(red: 0.92, green: 0.91, blue: 0.89, alpha: 0.07))
              ctx.setLineWidth(max(1.0, s * 0.003))
              ctx.move(to: CGPoint(x: rect.minX, y: s * 0.24))
              ctx.addLine(to: CGPoint(x: rect.maxX, y: s * 0.24))
              ctx.move(to: CGPoint(x: rect.minX, y: s * 0.76))
              ctx.addLine(to: CGPoint(x: rect.maxX, y: s * 0.76))
              ctx.move(to: CGPoint(x: s * 0.24, y: rect.minY))
              ctx.addLine(to: CGPoint(x: s * 0.24, y: rect.maxY))
              ctx.move(to: CGPoint(x: s * 0.76, y: rect.minY))
              ctx.addLine(to: CGPoint(x: s * 0.76, y: rect.maxY))
              ctx.strokePath()

              // Precision-machined monochrome 'M' drafting mark in warm chalk
              let mPath = CGMutablePath()
              let leftX = s * 0.30
              let rightX = s * 0.70
              let midX = s * 0.50
              let botY = s * 0.32
              let topY = s * 0.68
              let valleyY = s * 0.45

              mPath.move(to: CGPoint(x: leftX, y: botY))
              mPath.addLine(to: CGPoint(x: leftX, y: topY))
              mPath.addLine(to: CGPoint(x: midX, y: valleyY))
              mPath.addLine(to: CGPoint(x: rightX, y: topY))
              mPath.addLine(to: CGPoint(x: rightX, y: botY))

              ctx.setStrokeColor(CGColor(red: 0.925, green: 0.920, blue: 0.905, alpha: 0.95))
              ctx.setLineWidth(s * 0.062)
              ctx.setLineCap(.square)
              ctx.setLineJoin(.miter)
              ctx.addPath(mPath)
              ctx.strokePath()

              ctx.restoreGState()

              let borderPath = NSBezierPath(roundedRect: rect.insetBy(dx: s * 0.006, dy: s * 0.006), xRadius: cornerRadius, yRadius: cornerRadius)
              NSColor(calibratedWhite: 1.0, alpha: 0.14).setStroke()
              borderPath.lineWidth = max(1.0, s * 0.012)
              borderPath.stroke()

              NSGraphicsContext.restoreGraphicsState()
              return rep.representation(using: .png, properties: [:])
          }

          let specs: [(String, Int)] = [
              ("icon_16x16.png", 16),
              ("icon_16x16@2x.png", 32),
              ("icon_32x32.png", 32),
              ("icon_32x32@2x.png", 64),
              ("icon_128x128.png", 128),
              ("icon_128x128@2x.png", 256),
              ("icon_256x256.png", 256),
              ("icon_256x256@2x.png", 512),
              ("icon_512x512.png", 512),
              ("icon_512x512@2x.png", 1024)
          ]

          for (name, px) in specs {
              if let png = renderBlackMotifIcon(size: px) {
                  try? png.write(to: URL(fileURLWithPath: "build/AppIcon.iconset/\(name)"))
              }
          }
          EOF
          swift build/generate_icon.swift
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns
          ls -lh build/AppIcon.icns

      - name: Generate Package.swift
        run: |
          cat << 'EOF' > BlackMotif/Package.swift
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "BlackMotif",
              platforms: [
                  .macOS(.v14)
              ],
              products: [
                  .executable(name: "BlackMotif", targets: ["BlackMotif"])
              ],
              targets: [
                  .executableTarget(
                      name: "BlackMotif",
                      path: "Sources/BlackMotif",
                      resources: [
                          .process("Resources")
                      ],
                      swiftSettings: [
                          .swiftLanguageMode(.v5)
                      ],
                      linkerSettings: [
                          .linkedFramework("AppKit"),
                          .linkedFramework("SwiftUI"),
                          .linkedFramework("Security"),
                          .linkedFramework("IOKit"),
                          .linkedFramework("Metal"),
                          .linkedFramework("UniformTypeIdentifiers"),
                          .linkedFramework("Combine"),
                          .linkedFramework("CoreText"),
                          .linkedLibrary("sqlite3")
                      ]
                  )
              ]
          )
          EOF

      - name: Generate Monochrome Palette Engine, 3-Font Editorial Mixer & Domain Models (DomainModels.swift)
        run: |
          cat << 'EOF' > BlackMotif/Sources/BlackMotif/Models/DomainModels.swift
          import Foundation
          import SwiftUI
          import AppKit
          import CoreText

          // MARK: - 5 Calibrated Monochrome Paper & Graphite Themes
          public enum AppThemeID: String, CaseIterable, Codable, Identifiable {
              case rawNewsprint = "Raw Newsprint"
              case architectsVellum = "Architect’s Vellum"
              case pumiceAndClay = "Pumice & Clay"
              case mutedCarbon = "Muted Carbon"
              case lithographBlack = "Lithograph Black"

              public var id: String { rawValue }

              public var subtitle: String {
                  switch self {
                  case .rawNewsprint: return "Warm chalk paper (#F4F3EF) with 2B graphite ink and muted charcoal stamps"
                  case .architectsVellum: return "Cool Swiss drafting vellum (#F6F7F8) with clinical steel-lead typography"
                  case .pumiceAndClay: return "Low-contrast gallery stone (#E6E4DD) with soft soot ink and zero glare"
                  case .mutedCarbon: return "Velvety matte carbon (#161615) with chalk-dust ink and silver hairlines"
                  case .lithographBlack: return "Deepest matte ink wash (#0D0D0C) with bone-white ink and pewter rules"
                  }
              }

              public var isDark: Bool {
                  switch self {
                  case .rawNewsprint, .architectsVellum, .pumiceAndClay: return false
                  case .mutedCarbon, .lithographBlack: return true
                  }
              }
          }

          // MARK: - Per-Theme Custom Monochrome Overrides (Paper Canvas, Muted Ink Stamp & Thinking Vellum)
          public struct ThemeColorOverride: Codable, Equatable {
              public var isCustomCanvasEnabled: Bool = false
              public var canvasRed: Double
              public var canvasGreen: Double
              public var canvasBlue: Double

              public var isCustomAccentEnabled: Bool = false
              public var accentRed: Double
              public var accentGreen: Double
              public var accentBlue: Double

              public var isCustomThinkingEnabled: Bool = false
              public var thinkingRed: Double
              public var thinkingGreen: Double
              public var thinkingBlue: Double

              public var isModified: Bool {
                  isCustomCanvasEnabled || isCustomAccentEnabled || isCustomThinkingEnabled
              }

              public static func defaults(for theme: AppThemeID) -> ThemeColorOverride {
                  switch theme {
                  case .rawNewsprint:
                      return ThemeColorOverride(
                          canvasRed: 0.957, canvasGreen: 0.953, canvasBlue: 0.937,
                          accentRed: 0.137, accentGreen: 0.137, accentBlue: 0.129,
                          thinkingRed: 0.925, thinkingGreen: 0.918, thinkingBlue: 0.894
                      )
                  case .architectsVellum:
                      return ThemeColorOverride(
                          canvasRed: 0.965, canvasGreen: 0.969, canvasBlue: 0.973,
                          accentRed: 0.118, accentGreen: 0.125, accentBlue: 0.133,
                          thinkingRed: 0.929, thinkingGreen: 0.937, thinkingBlue: 0.949
                      )
                  case .pumiceAndClay:
                      return ThemeColorOverride(
                          canvasRed: 0.902, canvasGreen: 0.894, canvasBlue: 0.867,
                          accentRed: 0.157, accentGreen: 0.153, accentBlue: 0.145,
                          thinkingRed: 0.867, thinkingGreen: 0.855, thinkingBlue: 0.820
                      )
                  case .mutedCarbon:
                      return ThemeColorOverride(
                          canvasRed: 0.086, canvasGreen: 0.086, canvasBlue: 0.082,
                          accentRed: 0.863, accentGreen: 0.863, accentBlue: 0.839,
                          thinkingRed: 0.118, thinkingGreen: 0.118, thinkingBlue: 0.110
                      )
                  case .lithographBlack:
                      return ThemeColorOverride(
                          canvasRed: 0.051, canvasGreen: 0.051, canvasBlue: 0.047,
                          accentRed: 0.894, accentGreen: 0.894, accentBlue: 0.875,
                          thinkingRed: 0.078, thinkingGreen: 0.078, thinkingBlue: 0.075
                      )
                  }
              }
          }

          public struct CustomMonochromePalettes: Codable, Equatable {
              public var overridesByTheme: [String: ThemeColorOverride] = [:]
              public init() {}

              public func override(for theme: AppThemeID) -> ThemeColorOverride {
                  overridesByTheme[theme.rawValue] ?? ThemeColorOverride.defaults(for: theme)
              }

              public mutating func setOverride(_ override: ThemeColorOverride, for theme: AppThemeID) {
                  overridesByTheme[theme.rawValue] = override
              }

              public mutating func reset(for theme: AppThemeID) {
                  overridesByTheme.removeValue(forKey: theme.rawValue)
              }
          }

          // MARK: - 5-Step Graphite Spectrum Design Token System
          public struct MotifTokens: Equatable {
              public nonisolated(unsafe) static var customPalettes = CustomMonochromePalettes()

              public let theme: AppThemeID
              public let isWindowActive: Bool

              public init(theme: AppThemeID, isWindowActive: Bool = true) {
                  self.theme = theme
                  self.isWindowActive = isWindowActive
              }

              public var activeOverride: ThemeColorOverride {
                  Self.customPalettes.override(for: theme)
              }

              private var hasCustomCanvas: Bool {
                  activeOverride.isCustomCanvasEnabled
              }

              public var hasCustomAccent: Bool {
                  activeOverride.isCustomAccentEnabled
              }

              private var hasCustomThinking: Bool {
                  activeOverride.isCustomThinkingEnabled
              }

              private var customCanvasLuminance: Double {
                  let c = activeOverride
                  return 0.2126 * c.canvasRed + 0.7152 * c.canvasGreen + 0.0722 * c.canvasBlue
              }

              public var isEffectivelyDark: Bool {
                  if hasCustomCanvas {
                      return customCanvasLuminance < 0.42
                  }
                  return theme.isDark
              }

              /// Level 1: Primary Reading Paper Canvas
              public var canvasBackground: Color {
                  if hasCustomCanvas {
                      let c = activeOverride
                      return Color(red: c.canvasRed, green: c.canvasGreen, blue: c.canvasBlue)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.957, green: 0.953, blue: 0.937)
                  case .architectsVellum: return Color(red: 0.965, green: 0.969, blue: 0.973)
                  case .pumiceAndClay: return Color(red: 0.902, green: 0.894, blue: 0.867)
                  case .mutedCarbon: return Color(red: 0.086, green: 0.086, blue: 0.082)
                  case .lithographBlack: return Color(red: 0.051, green: 0.051, blue: 0.047)
                  }
              }

              /// Level 2: Left Index & Right Studio Ledger Substrate (1.8% subtle tonal shift from center paper)
              public var sidebarBackground: Color {
                  if hasCustomCanvas {
                      let c = activeOverride
                      let factor = isEffectivelyDark ? 1.18 : 0.972
                      return Color(
                          red: min(1.0, max(0.0, c.canvasRed * factor)),
                          green: min(1.0, max(0.0, c.canvasGreen * factor)),
                          blue: min(1.0, max(0.0, c.canvasBlue * factor))
                      )
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.937, green: 0.931, blue: 0.912)
                  case .architectsVellum: return Color(red: 0.945, green: 0.951, blue: 0.957)
                  case .pumiceAndClay: return Color(red: 0.882, green: 0.873, blue: 0.843)
                  case .mutedCarbon: return Color(red: 0.072, green: 0.072, blue: 0.068)
                  case .lithographBlack: return Color(red: 0.039, green: 0.039, blue: 0.036)
                  }
              }

              public var surroundSubstrate: Color { sidebarBackground }

              /// Level 0 / Level 3: Recessed Wells & Micro-Embossed Button Surface
              public var elevatedSurface: Color {
                  if hasCustomCanvas {
                      let c = activeOverride
                      if isEffectivelyDark {
                          return Color(
                              red: min(1.0, c.canvasRed + 0.035),
                              green: min(1.0, c.canvasGreen + 0.035),
                              blue: min(1.0, c.canvasBlue + 0.033)
                          )
                      } else {
                          return Color(
                              red: max(0.0, c.canvasRed * 0.956),
                              green: max(0.0, c.canvasGreen * 0.956),
                              blue: max(0.0, c.canvasBlue * 0.952)
                          )
                      }
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.918, green: 0.912, blue: 0.890)
                  case .architectsVellum: return Color(red: 0.925, green: 0.933, blue: 0.945)
                  case .pumiceAndClay: return Color(red: 0.863, green: 0.851, blue: 0.820)
                  case .mutedCarbon: return Color(red: 0.118, green: 0.118, blue: 0.112)
                  case .lithographBlack: return Color(red: 0.078, green: 0.078, blue: 0.075)
                  }
              }

              /// Drafting Vellum Surface for Thought Process
              public var thinkingSurface: Color {
                  if hasCustomThinking {
                      let c = activeOverride
                      return Color(red: c.thinkingRed, green: c.thinkingGreen, blue: c.thinkingBlue)
                  }
                  return elevatedSurface
              }

              public var thinkingText: Color {
                  if hasCustomThinking {
                      let c = activeOverride
                      let lum = 0.2126 * c.thinkingRed + 0.7152 * c.thinkingGreen + 0.0722 * c.thinkingBlue
                      return lum < 0.42
                          ? Color(red: 0.82, green: 0.82, blue: 0.79)
                          : Color(red: 0.28, green: 0.28, blue: 0.26)
                  }
                  return secondaryText
              }

              /// Active Selection Wash
              public var selectionPill: Color {
                  if hasCustomCanvas {
                      let c = activeOverride
                      if isEffectivelyDark {
                          return Color(
                              red: min(1.0, c.canvasRed + 0.075),
                              green: min(1.0, c.canvasGreen + 0.075),
                              blue: min(1.0, c.canvasBlue + 0.070)
                          )
                      } else {
                          return Color(
                              red: max(0.0, c.canvasRed * 0.915),
                              green: max(0.0, c.canvasGreen * 0.915),
                              blue: max(0.0, c.canvasBlue * 0.910)
                          )
                      }
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.886, green: 0.878, blue: 0.855)
                  case .architectsVellum: return Color(red: 0.890, green: 0.902, blue: 0.918)
                  case .pumiceAndClay: return Color(red: 0.827, green: 0.816, blue: 0.780)
                  case .mutedCarbon: return Color(red: 0.155, green: 0.155, blue: 0.148)
                  case .lithographBlack: return Color(red: 0.114, green: 0.114, blue: 0.108)
                  }
              }

              /// Muted Black / Chalk Primary Ink (Never harsh pure #000000 or pure #FFFFFF)
              public var primaryText: Color {
                  if hasCustomCanvas {
                      return isEffectivelyDark
                          ? Color(red: 0.885, green: 0.885, blue: 0.865)
                          : Color(red: 0.145, green: 0.145, blue: 0.137)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.145, green: 0.145, blue: 0.137)
                  case .architectsVellum: return Color(red: 0.125, green: 0.133, blue: 0.145)
                  case .pumiceAndClay: return Color(red: 0.165, green: 0.161, blue: 0.153)
                  case .mutedCarbon: return Color(red: 0.875, green: 0.875, blue: 0.851)
                  case .lithographBlack: return Color(red: 0.902, green: 0.902, blue: 0.882)
                  }
              }

              /// 2B Graphite / Silver Lead Secondary Ink
              public var secondaryText: Color {
                  if hasCustomCanvas {
                      return isEffectivelyDark
                          ? Color(red: 0.580, green: 0.580, blue: 0.560)
                          : Color(red: 0.385, green: 0.382, blue: 0.365)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.392, green: 0.388, blue: 0.373)
                  case .architectsVellum: return Color(red: 0.365, green: 0.380, blue: 0.404)
                  case .pumiceAndClay: return Color(red: 0.404, green: 0.396, blue: 0.373)
                  case .mutedCarbon: return Color(red: 0.565, green: 0.565, blue: 0.545)
                  case .lithographBlack: return Color(red: 0.525, green: 0.525, blue: 0.506)
                  }
              }

              /// Whisper Graphite Tertiary Ink
              public var mutedText: Color {
                  if hasCustomCanvas {
                      return isEffectivelyDark
                          ? Color(red: 0.430, green: 0.430, blue: 0.415)
                          : Color(red: 0.530, green: 0.525, blue: 0.505)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.545, green: 0.540, blue: 0.520)
                  case .architectsVellum: return Color(red: 0.515, green: 0.530, blue: 0.555)
                  case .pumiceAndClay: return Color(red: 0.540, green: 0.530, blue: 0.505)
                  case .mutedCarbon: return Color(red: 0.415, green: 0.415, blue: 0.400)
                  case .lithographBlack: return Color(red: 0.375, green: 0.375, blue: 0.360)
                  }
              }

              /// Exposed Architectural Grid Hairlines
              public var hairline: Color {
                  if hasCustomCanvas {
                      return isEffectivelyDark ? Color.white.opacity(0.085) : Color.black.opacity(0.095)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.137, green: 0.137, blue: 0.129).opacity(0.105)
                  case .architectsVellum: return Color(red: 0.118, green: 0.125, blue: 0.133).opacity(0.095)
                  case .pumiceAndClay: return Color(red: 0.157, green: 0.153, blue: 0.145).opacity(0.115)
                  case .mutedCarbon: return Color.white.opacity(0.085)
                  case .lithographBlack: return Color.white.opacity(0.080)
                  }
              }

              /// Tactile Key Border
              public var strongBorder: Color {
                  if hasCustomCanvas {
                      return isEffectivelyDark ? Color.white.opacity(0.22) : Color.black.opacity(0.22)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.137, green: 0.137, blue: 0.129).opacity(0.24)
                  case .architectsVellum: return Color(red: 0.118, green: 0.125, blue: 0.133).opacity(0.22)
                  case .pumiceAndClay: return Color(red: 0.157, green: 0.153, blue: 0.145).opacity(0.26)
                  case .mutedCarbon: return Color.white.opacity(0.20)
                  case .lithographBlack: return Color.white.opacity(0.19)
                  }
              }

              /// Level 4: Muted Carbon Stamp (Monochrome Primary Action Ink)
              public var accentAction: Color {
                  if !isWindowActive { return mutedText }
                  if hasCustomAccent {
                      let c = activeOverride
                      return Color(red: c.accentRed, green: c.accentGreen, blue: c.accentBlue)
                  }
                  switch theme {
                  case .rawNewsprint: return Color(red: 0.157, green: 0.157, blue: 0.149)
                  case .architectsVellum: return Color(red: 0.137, green: 0.145, blue: 0.157)
                  case .pumiceAndClay: return Color(red: 0.176, green: 0.173, blue: 0.165)
                  case .mutedCarbon: return Color(red: 0.855, green: 0.855, blue: 0.831)
                  case .lithographBlack: return Color(red: 0.886, green: 0.886, blue: 0.867)
                  }
              }

              public var accentForeground: Color {
                  if hasCustomAccent {
                      let c = activeOverride
                      let lum = 0.2126 * c.accentRed + 0.7152 * c.accentGreen + 0.0722 * c.accentBlue
                      return lum > 0.55 ? Color(red: 0.09, green: 0.09, blue: 0.085) : Color(red: 0.95, green: 0.945, blue: 0.93)
                  }
                  switch theme {
                  case .mutedCarbon: return Color(red: 0.086, green: 0.086, blue: 0.082)
                  case .lithographBlack: return Color(red: 0.051, green: 0.051, blue: 0.047)
                  default: return Color(red: 0.957, green: 0.953, blue: 0.937)
                  }
              }

              /// Muted Monochrome Residency Indicator (High-definition graphite/chalk contrast, zero neon colors)
              public var statusOnline: Color {
                  primaryText
              }

              public static let sidebarDefaultWidth: CGFloat = 244.0
              public static let sidebarMinWidth: CGFloat = 212.0
              public static let sidebarMaxWidth: CGFloat = 320.0
              public static let studioLedgerDefaultWidth: CGFloat = 316.0
              public static let studioLedgerMinWidth: CGFloat = 284.0
              public static let studioLedgerMaxWidth: CGFloat = 380.0
          }

          // MARK: - Independent 3-Font Editorial Typographic Mixer
          public enum DisplayFontChoice: String, CaseIterable, Codable, Identifiable {
              case newsreaderSerif = "Newsreader (Editorial Serif)"

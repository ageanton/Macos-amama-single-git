                  let savedKV = UserDefaults.standard.string(forKey: "BlackMotifKVCacheTypeV1") ?? KVCacheQuantization.f16.rawValue
                  self.kvCacheTypeEnv = KVCacheQuantization(rawValue: savedKV) ?? .f16
                  self.autoUnloadOnMinimize = UserDefaults.standard.bool(forKey: "BlackMotifAutoUnloadMinimizeV1")
                  self.useThinkingForSummary = UserDefaults.standard.bool(forKey: "BlackMotifUseThinkingForSummaryV1")

                  terminationObserver = NotificationCenter.default.addObserver(
                      forName: NSApplication.willTerminateNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      self?.terminateManagedDaemonGracefully()

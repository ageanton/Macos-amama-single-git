              private func commitActiveRenameIfNeeded() {
                  if let activeFolderID = renamingFolderID {
                      store.renameWorkspace(folderID: activeFolderID, newName: folderRenameDraft)
                      renamingFolderID = nil
                  }
                  guard let activeID = renamingSessionID else { return }
                  store.commitInlineRename(sessionID: activeID, proposedName: renameDraft)
                  renamingSessionID = nil
              }

              @ViewBuilder
              private func chatRowItem(_ session: ConversationSession, indexNumber: Int, indented: Bool) -> some View {
                  let isSelected = store.selectedSessionID == session.id && !store.isSettingsViewActive
                  let isGeneratingHere = store.isStreamingGeneration && store.streamingSessionID == session.id
                  let isBranchedChat = session.title.lowercased().hasPrefix("branch")

                  if renamingSessionID == session.id {
                      HStack(spacing: 6) {
                          TextField("Folio title", text: $renameDraft)
                              .textFieldStyle(.plain)
                              .font(typo.sans(size: 12.5, weight: .medium))
                              .foregroundColor(tokens.primaryText)
                              .focused($isRenameFocused)
                              .onSubmit { commitActiveRenameIfNeeded() }
                              .onExitCommand { renamingSessionID = nil }

                          Button("OK") { commitActiveRenameIfNeeded() }
                              .font(typo.mono(size: 9.5, weight: .semibold))
                              .foregroundColor(tokens.primaryText)
                              .buttonStyle(.plain)

                          Button("×") { renamingSessionID = nil }
                              .font(typo.mono(size: 11, weight: .semibold))
                              .foregroundColor(tokens.mutedText)
                              .buttonStyle(.plain)
                      }
                      .padding(.leading, indented ? 22 : 10)
                      .padding(.trailing, 8)
                      .frame(height: 28)
                      .background(
                          RoundedRectangle(cornerRadius: 3, style: .continuous)
                              .fill(tokens.canvasBackground)
                      )
                      .overlay(
                          RoundedRectangle(cornerRadius: 3, style: .continuous)
                              .strokeBorder(tokens.strongBorder, lineWidth: 0.75)
                      )
                      .padding(.horizontal, 8)
                  } else {
                      Button {
                          commitActiveRenameIfNeeded()
                          store.selectedSessionID = session.id
                      } label: {
                          HStack(spacing: 7) {
                              // 2pt Muted Carbon Bookmark Indicator on Active Folio
                              Rectangle()
                                  .fill(isSelected ? tokens.accentAction : Color.clear)
                                  .frame(width: 2, height: 14)

                              Text(isBranchedChat ? "↳" : String(format: "%02d", indexNumber))
                                  .font(typo.mono(size: 9.5, weight: isSelected ? .semibold : .regular))
                                  .foregroundColor(isSelected ? tokens.primaryText : tokens.mutedText)
                                  .frame(width: 16, alignment: .leading)

                              Text(session.title)
                                  .font(typo.sans(size: 12.5, weight: isSelected ? .medium : .regular))
                                  .foregroundColor(isSelected ? tokens.primaryText : tokens.secondaryText)
                                  .lineLimit(1)

                              Spacer(minLength: 4)

                              if isGeneratingHere {
                                  Rectangle()
                                      .fill(tokens.primaryText)
                                      .frame(width: 5, height: 5)
                              }
                          }
                          .padding(.leading, indented ? 16 : 6)
                          .padding(.trailing, 8)
                          .frame(height: 28)
                          .background(
                              RoundedRectangle(cornerRadius: 3, style: .continuous)
                                  .fill(isSelected ? tokens.selectionPill : Color.clear)
                          )
                          .overlay(
                              RoundedRectangle(cornerRadius: 3, style: .continuous)
                                  .strokeBorder(isSelected ? tokens.hairline : Color.clear, lineWidth: 0.75)
                          )
                          .contentShape(Rectangle())
                      }
                      .buttonStyle(.plain)
                      .padding(.horizontal, 8)
                      .contextMenu {
                          Button("Rename Folio") {
                              commitActiveRenameIfNeeded()
                              renameDraft = session.title
                              renamingSessionID = session.id
                              DispatchQueue.main.asyncAfter(deadline: .now() + 0.05) {
                                  isRenameFocused = true
                              }
                          }
                          Button("Duplicate Folio") {
                              store.duplicateSession(session.id)
                          }
                          Button("Export as Markdown…") {
                              store.exportSessionAsMarkdown(session.id)
                          }
                          if !store.folders.isEmpty {
                              Menu("Move to Workspace") {
                                  Button("Unfiled Index") {
                                      if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                          store.sessions[idx].folderID = nil
                                          store.saveAllState()
                                      }
                                  }
                                  ForEach(store.folders) { folder in
                                      Button(folder.name) {
                                          if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                              store.sessions[idx].folderID = folder.id
                                              store.saveAllState()
                                          }
                                      }
                                  }
                              }
                          }
                          Divider()
                          Button("Move to Archive", role: .destructive) {
                              store.moveSessionToTrash(session.id)
                          }
                      }
                  }
              }
          }

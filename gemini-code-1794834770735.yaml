                                                      .foregroundColor(isSelected ? tokens.accentForeground : tokens.primaryText)
                                                      .frame(maxWidth: .infinity)
                                                      .frame(height: 24)
                                                      .background(isSelected ? tokens.accentAction : tokens.canvasBackground)

                                          Spacer()
                                      }
                                      .padding(.top, 4)
                                      .contentShape(Rectangle())
                                  }
                                  .buttonStyle(.plain)

                                  if isAdvancedCLIExpanded {
                                      VStack(alignment: .leading, spacing: 9) {
                                          ArchitecturalIntStepperRow(title: "Batch Size (num_batch)", subtitle: "Lower values reduce Metal compute spikes", value: session.parameters.numBatch, defaultValue: 512, range: 32...2048, step: 64, tokens: tokens, typo: typo)
                                          ArchitecturalIntStepperRow(title: "GPU Layers (-1 = Auto)", subtitle: "Transformer layers offloaded to GPU", value: session.parameters.numGpu, defaultValue: -1, range: -1...128, step: 1, tokens: tokens, typo: typo)
                                          ArchitecturalIntStepperRow(title: "CPU Threads (0 = Auto)", subtitle: "0 uses fast Apple Silicon P-cores", value: session.parameters.numThread, defaultValue: 0, range: 0...32, step: 1, tokens: tokens, typo: typo)
                                          ArchitecturalIntStepperRow(title: "Top-K", subtitle: "Top K sampling pool", value: session.parameters.topK, defaultValue: 40, range: 1...200, step: 5, tokens: tokens, typo: typo)
                                          ArchitecturalIntStepperRow(title: "Max Output (num_predict)", subtitle: "Maximum tokens generated per reply", value: session.parameters.numPredict, defaultValue: 16384, range: 512...65536, step: 512, tokens: tokens, typo: typo)
                                          ArchitecturalIntStepperRow(title: "Keep-Alive (min)", subtitle: "Minutes weights stay mapped in RAM", value: session.parameters.keepAliveMinutes, defaultValue: 15, range: 0...120, step: 5, tokens: tokens, typo: typo)
                                          ArchitecturalIntStepperRow(title: "Seed (-1 = Random)", subtitle: "Deterministic RNG seed", value: session.parameters.seed, defaultValue: -1, range: -1...999999, step: 1, tokens: tokens, typo: typo)


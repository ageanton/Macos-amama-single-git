              // MARK: - Monochrome Model Spec Cell (With 2px Graphite Loading Sweep & Completion Rim Flicker)
              @ViewBuilder
              private func modelSpecHeaderCell(isCompactWindow: Bool) -> some View {
                  let isLoading = store.isLoadingModelWeights
                  let snap = store.memorySnapshot
                  let loadFraction = isLoading ? CGFloat(min(0.99, max(0.03, snap.loadProgressAgainstTarget))) : 0.0
                  let pct = Int(loadFraction * 100.0)
                  let isResident = store.activeModelDescriptor?.residency == .activeInUnifiedRAM
                  let flashOpacity = store.modelLoadCompletionRimFlashOpacity
                  let isFlashingCompletion = flashOpacity > 0.01
                  let activeModelTitle = isLoading
                      ? LocalModelDescriptor.shortenModelName(store.loadingModelName)
                      : (store.activeModelDescriptor?.shortDisplayName ?? "NO MODEL")

                  Button {
                      if store.isStudioLedgerVisible && store.activeRightLedgerTab == .studio {
                          store.isStudioLedgerVisible = false
                      } else {
                          store.openStudioLedger(tab: .studio)
                      }
                  } label: {
                      VStack(spacing: 0) {
                          HStack(spacing: 6) {
                              if isLoading {
                                  Rectangle()
                                      .fill(tokens.accentAction)
                                      .frame(width: 5, height: 5)
                              } else if isResident {
                                  Rectangle()
                                      .fill(tokens.primaryText)
                                      .frame(width: 5, height: 5)
                              } else {
                                  Rectangle()
                                      .strokeBorder(tokens.mutedText, lineWidth: 1.0)
                                      .frame(width: 5, height: 5)
                              }

                              if !isCompactWindow {
                                  Text("MODEL //")
                                      .font(typo.mono(size: 9.5, weight: .medium))
                                      .foregroundColor(tokens.mutedText)
                              }

                              Text(activeModelTitle)
                                  .font(typo.mono(size: 10.5, weight: .semibold))
                                  .foregroundColor(tokens.primaryText)
                                  .lineLimit(1)
                                  .frame(maxWidth: isCompactWindow ? 110 : 165, alignment: .leading)

                              if isLoading {
                                  Text("\(pct)%")
                                      .font(typo.mono(size: 10, weight: .bold))
                                      .foregroundColor(tokens.primaryText)
                              }
                          }
                          .padding(.horizontal, 9)
                          .frame(height: 23)

                          // 2px Monochrome Graphite Progress Rule Along Bottom Edge When Loading
                          if isLoading {
                              GeometryReader { barGeo in
                                  ZStack(alignment: .leading) {
                                      Rectangle().fill(tokens.hairline)
                                      Rectangle()
                                          .fill(tokens.accentAction)
                                          .frame(width: max(4, barGeo.size.width * loadFraction))
                                  }
                              }
                              .frame(height: 2)
                          }
                      }
                      .frame(height: 25)
                      .background(
                          RoundedRectangle(cornerRadius: 3, style: .continuous)
                              .fill(
                                  isFlashingCompletion
                                      ? tokens.selectionPill.opacity(max(0.4, flashOpacity))
                                      : (store.isStudioLedgerVisible && store.activeRightLedgerTab == .studio ? tokens.selectionPill : tokens.elevatedSurface.opacity(0.65))
                              )
                      )
                      .overlay(
                          RoundedRectangle(cornerRadius: 3, style: .continuous)
                              .strokeBorder(
                                  isFlashingCompletion
                                      ? tokens.primaryText.opacity(max(0.45, flashOpacity))
                                      : (isLoading ? tokens.strongBorder : tokens.hairline),
                                  lineWidth: isFlashingCompletion ? 1.5 : 0.75
                              )
                      )
                  }
                  .buttonStyle(.plain)
                  .help("Inspect or switch model & runtime parameters in Studio Ledger")
              }


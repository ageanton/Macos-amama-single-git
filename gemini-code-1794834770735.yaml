          // MARK: - Custom Flat-Track Monochrome Slider (`1px` Rule + `7x11pt` Square Graphite Thumb)
          public struct ArchitecturalSlider: View {
              public let title: String
              public let subtitle: String
              @Binding public var value: Double
              public let defaultValue: Double
              public let range: ClosedRange<Double>
              public let tokens: MotifTokens
              public let typo: TypographyConfiguration

              @State private var isHovering: Bool = false

              private var isModified: Bool {
                  abs(value - defaultValue) > 0.005
              }

              private var normalizedFraction: CGFloat {
                  let span = max(0.0001, range.upperBound - range.lowerBound)
                  return CGFloat(min(1.0, max(0.0, (value - range.lowerBound) / span)))
              }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      HStack(alignment: .center, spacing: 6) {
                          Text(title)
                              .font(typo.sans(size: 11.5, weight: .medium))
                              .foregroundColor(tokens.primaryText)

                          Spacer()

                          Text(String(format: "%.2f", value))
                              .font(typo.mono(size: 10.5, weight: .medium))
                              .foregroundColor(tokens.primaryText)

                          Button {
                              value = defaultValue
                          } label: {
                              Image(systemName: "arrow.counterclockwise")
                                  .font(.system(size: 9.5, weight: .semibold))
                                  .foregroundColor(isModified ? tokens.primaryText : tokens.mutedText.opacity(0.35))
                                  .frame(width: 16, height: 16)
                                  .background(
                                      RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                          .fill(isModified ? tokens.elevatedSurface : Color.clear)
                                  )
                          }
                          .buttonStyle(.plain)
                          .disabled(!isModified)
                          .help("\(subtitle) · Click to reset to \(String(format: "%.2f", defaultValue))")
                      }

                      GeometryReader { geo in
                          let trackWidth = max(1, geo.size.width)
                          let thumbW: CGFloat = 7
                          let thumbH: CGFloat = 12
                          let usableWidth = max(1, trackWidth - thumbW)
                          let thumbX = usableWidth * normalizedFraction

                          ZStack(alignment: .leading) {
                              // Base 1px graphite track
                              Rectangle()
                                  .fill(tokens.hairline)
                                  .frame(height: 1.2)

                              // Active filled graphite segment
                              Rectangle()
                                  .fill(tokens.accentAction.opacity(0.75))
                                  .frame(width: thumbX + (thumbW * 0.5), height: 1.5)

                              // Precision rectangular drafting thumb
                              RoundedRectangle(cornerRadius: 1.5, style: .continuous)
                                  .fill(tokens.accentAction)
                                  .frame(width: thumbW, height: thumbH)
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 1.5, style: .continuous)
                                          .strokeBorder(tokens.canvasBackground, lineWidth: 0.75)
                                  )
                                  .offset(x: thumbX)
                          }
                          .frame(height: 16)
                          .contentShape(Rectangle())
                          .gesture(
                              DragGesture(minimumDistance: 0)
                                  .onChanged { gesture in
                                      let pct = min(1.0, max(0.0, gesture.location.x / trackWidth))
                                      let rawVal = range.lowerBound + Double(pct) * (range.upperBound - range.lowerBound)
                                      value = (rawVal * 100.0).rounded() / 100.0
                                  }
                          )
                      }
                      .frame(height: 16)
                  }
                  .onHover { isHovering = $0 }
                  .help(subtitle)
              }
          }


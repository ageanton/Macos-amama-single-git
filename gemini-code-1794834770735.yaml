                                  ArchitecturalKeyButton("SELECT FOLDER…", tokens: tokens, typo: typo) {
                                      store.selectExternalDriveAndReloadModels()
                                  }
                              }
                          }

                          HairlineDivider(tokens: tokens)

                          // 05 // ENGINE SUPERVISOR & KEYBOARD SHORTCUTS
                          VStack(alignment: .leading, spacing: 10) {
                              Text("05 // ENGINE SUPERVISOR & SHORTCUTS")
                                  .font(typo.mono(size: 10, weight: .semibold))
                                  .tracking(0.8)
                                  .foregroundColor(tokens.mutedText)

                              Text(store.supervisor.supervisorStatusLog)
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.secondaryText)

                              TextField("Endpoint URL", text: $store.supervisor.engineEndpoint)
                                  .textFieldStyle(.roundedBorder)

                              Picker("Daemon KV Cache Quantization", selection: $store.supervisor.kvCacheTypeEnv) {
                                  ForEach(KVCacheQuantization.allCases) { q in
                                      Text(q.displayTitle).tag(q)
                                  }
                              }
                              .font(typo.sans(size: 12))

                              Toggle("Enable Flash Attention (OLLAMA_FLASH_ATTENTION=1)", isOn: $store.supervisor.enableFlashAttentionEnv)
                                  .font(typo.sans(size: 12))
                              Toggle("Release model RAM when window is minimized", isOn: $store.supervisor.autoUnloadOnMinimize)
                                  .font(typo.sans(size: 12))
                              Toggle("Use thinking when summarizing context (Off = fast summary)", isOn: $store.supervisor.useThinkingForSummary)
                                  .font(typo.sans(size: 12))

                              HStack(spacing: 10) {
                                  ArchitecturalKeyButton("APPLY & RESTART DAEMON", isPrimaryStamp: true, tokens: tokens, typo: typo) {
                                      store.applyDaemonConfigurationAndRestart()
                                  }
                                  ArchitecturalKeyButton("STOP DAEMON", tokens: tokens, typo: typo) {
                                      store.supervisor.terminateManagedDaemonGracefully()
                                  }
                              }
                          }
                      }
                      .frame(maxWidth: 740, alignment: .leading)
                      .padding(28)
                      .frame(maxWidth: .infinity)
                      .background(OverlayScrollConfigurator(isDark: tokens.isEffectivelyDark).frame(width: 1, height: 1))
                  }
              }
          }
          EOF

      - name: Generate True Edge-to-Edge Fullscreen Three-Plane Folio Root (MotifApp.swift)
        run: |
          cat << 'EOF' > BlackMotif/Sources/BlackMotif/MotifApp.swift
          import SwiftUI
          import AppKit

          // MARK: - AppKit Window Configurator (True Fullscreen Without NSToolbar Chrome)
          public struct FullSizeWindowConfigurator: NSViewRepresentable {
              public let isDark: Bool

              public init(isDark: Bool) {
                  self.isDark = isDark
              }

              public func makeNSView(context: Context) -> NSView {
                  let view = NSView()
                  DispatchQueue.main.async {
                      guard let window = view.window else { return }
                      window.titleVisibility = .hidden
                      window.titlebarAppearsTransparent = true
                      window.styleMask.insert(.fullSizeContentView)
                      window.toolbar = nil
                      window.appearance = NSAppearance(named: isDark ? .darkAqua : .aqua)
                  }
                  return view
              }

              public func updateNSView(_ nsView: NSView, context: Context) {
                  DispatchQueue.main.async {
                      guard let window = nsView.window else { return }
                      if window.toolbar != nil {
                          window.toolbar = nil
                      }
                      if !window.styleMask.contains(.fullSizeContentView) {
                          window.styleMask.insert(.fullSizeContentView)
                      }
                      let targetApp = NSAppearance(named: isDark ? .darkAqua : .aqua)
                      if window.appearance != targetApp {
                          window.appearance = targetApp
                      }
                  }
              }
          }

          public struct BlackMotifRootView: View {
              @ObservedObject public var store: WorkstationStore
              @Environment(\.controlActiveState) private var controlActiveState

              private var isWindowActive: Bool {
                  controlActiveState != .inactive
              }

              private var tokens: MotifTokens {
                  MotifTokens(theme: store.activeTheme, isWindowActive: isWindowActive)
              }

              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  GeometryReader { geo in
                      HStack(spacing: 0) {
                          // Plane 1: Left Index Ledger
                          if store.isSidebarVisible {
                              SidebarNavigationView(store: store, tokens: tokens)
                                  .frame(width: store.sidebarWidth)
                          }

                          // Plane 2: Center Reading Sheet (or In-Grid Settings Specification Page)
                          EditorialConversationView(store: store, tokens: tokens)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)

                          // Plane 3: Right Studio, Memory & Code Ledger
                          if store.isStudioLedgerVisible && !store.isSettingsViewActive {
                              RightStudioLedgerView(store: store, tokens: tokens)
                                  .frame(width: store.studioLedgerWidth)
                          }
                      }
                      .background(FullSizeWindowConfigurator(isDark: tokens.isEffectivelyDark).frame(width: 0, height: 0))
                      .background(tokens.canvasBackground)
                      .ignoresSafeArea(.container, edges: .top)
                      .onChange(of: geo.size.width) { _, newWidth in
                          if newWidth < 1060 && store.isStudioLedgerVisible && store.isSidebarVisible {
                              store.isStudioLedgerVisible = false
                          }
                      }
                  }
                  .sheet(isPresented: $store.isNewWorkspaceSheetPresented) {
                      CreateNamedItemSheet(
                          heading: "New Workspace",
                          placeholder: "Workspace name (e.g. Architecture)",
                          tokens: tokens,
                          typo: typo
                      ) { name in
                          store.createWorkspace(name: name)
                      }
                  }
                  .sheet(isPresented: $store.isNewPresetSheetPresented) {
                      CreateNamedItemSheet(
                          heading: "Save Parameter Preset",
                          placeholder: "Preset name (e.g. Deep Reasoning)",
                          tokens: tokens,
                          typo: typo
                      ) { name in
                          store.createPreset(name: name)
                      }
                  }
                  .alert(
                      "Large Model Memory Warning",
                      isPresented: Binding(
                          get: { store.pendingSSDSwapWarningModel != nil },
                          set: { if !$0 { store.pendingSSDSwapWarningModel = nil } }
                      ),
                      presenting: store.pendingSSDSwapWarningModel
                  ) { targetModel in
                      Button("Load with Tight-RAM Optimization (Recommended)") {
                          store.pendingSSDSwapWarningModel = nil
                          store.applyTightRAMOptimization(andLoadModel: targetModel)
                      }
                      Button("Load Anyway (May Use SSD Swap)") {
                          store.selectAndLoadModel(targetModel, bypassSwapGuard: true)
                      }
                      Button("Cancel", role: .cancel) {
                          store.pendingSSDSwapWarningModel = nil
                      }
                  } message: { targetModel in
                      let reclaimableGB = Double(store.liveOllamaResidentBytes) / 1_073_741_824.0
                      let availableGB = store.memorySnapshot.headroomGB + reclaimableGB
                      Text("“\(targetModel.shortDisplayName)” requires \(targetModel.formattedSize), and \(String(format: "%.1f GB", availableGB)) is currently available before swap.")
                  }
              }
          }

          public final class BlackMotifAppDelegate: NSObject, NSApplicationDelegate {
              public func applicationDidFinishLaunching(_ notification: Notification) {
                  CustomFontRegistrar.registerBundledFonts()
                  NSWindow.allowsAutomaticWindowTabbing = false
              }
          }

          @main
          public struct BlackMotifApp: App {
              @NSApplicationDelegateAdaptor(BlackMotifAppDelegate.self) private var appDelegate
              @StateObject private var store = WorkstationStore()

              private func keyEq(_ raw: String, fallback: Character) -> KeyEquivalent {
                  let ch = raw.trimmingCharacters(in: .whitespacesAndNewlines).lowercased().first ?? fallback
                  return KeyEquivalent(ch)
              }

              public var body: some Scene {
                  WindowGroup("BlackMotif") {
                      let rootTokens = MotifTokens(theme: store.activeTheme, isWindowActive: true)
                      BlackMotifRootView(store: store)
                          .frame(minWidth: 860, minHeight: 540)
                          .preferredColorScheme(rootTokens.isEffectivelyDark ? .dark : .light)
                  }
                  .windowStyle(.hiddenTitleBar)
                  .commands {
                      CommandGroup(replacing: .appSettings) {
                          Button("Settings…") {
                              store.isSettingsViewActive.toggle()
                          }
                          .keyboardShortcut(",", modifiers: [.command])
                      }

                      CommandGroup(replacing: .newItem) {
                          Button("New Folio") {
                              store.createNewSession(folderID: nil)
                          }
                          .keyboardShortcut(keyEq(store.shortcuts.newChatKey, fallback: "n"), modifiers: [.command])

                          Button("Toggle Index Ledger") {
                              store.isSidebarVisible.toggle()
                          }
                          .keyboardShortcut(keyEq(store.shortcuts.toggleSidebarKey, fallback: "s"), modifiers: [.command])

                          Button("Toggle Studio Ledger") {
                              store.isStudioLedgerVisible.toggle()
                          }
                          .keyboardShortcut(keyEq(store.shortcuts.toggleInspectorKey, fallback: "\\"), modifiers: [.command])

                          Divider()

                          Button("Increase Text Size") {
                              store.adjustActiveFontSize(delta: 0.5)
                          }
                          .keyboardShortcut("=", modifiers: [.command])

                          Button("Decrease Text Size") {
                              store.adjustActiveFontSize(delta: -0.5)
                          }
                          .keyboardShortcut("-", modifiers: [.command])

                          Divider()

                          Button("Stop Generation") {
                              store.stopActiveGeneration()
                          }
                          .keyboardShortcut(keyEq(store.shortcuts.stopGenerationKey, fallback: "."), modifiers: [.command])
                      }
                  }
              }
          }
          EOF

      - name: Compile Release Universal Binary (Swift 6)
        run: |
          cd BlackMotif
          swift build -c release --arch arm64
          ls -lh .build/arm64-apple-macosx/release/BlackMotif

      - name: Assemble BlackMotif Application Bundle (.app)
        run: |
          set -e
          rm -rf build/dmg_staging/*
          APP_BUNDLE="build/dmg_staging/${APP_NAME}.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources/Fonts"

          cp BlackMotif/.build/arm64-apple-macosx/release/BlackMotif "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

          cp build/AppIcon.icns "${APP_BUNDLE}/Contents/Resources/AppIcon.icns"
          cp -R BlackMotif/Sources/BlackMotif/Resources/Fonts/* "${APP_BUNDLE}/Contents/Resources/Fonts/" 2>/dev/null || true

          if [ -d "BlackMotif/.build/arm64-apple-macosx/release/BlackMotif_BlackMotif.bundle" ]; then
            cp -R "BlackMotif/.build/arm64-apple-macosx/release/BlackMotif_BlackMotif.bundle" "${APP_BUNDLE}/Contents/Resources/"
          fi

          cat << EOF > "${APP_BUNDLE}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>${DISPLAY_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${DISPLAY_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${BUILD_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "${APP_BUNDLE}"
          codesign --verify --verbose "${APP_BUNDLE}"

      - name: Package Compressed macOS Disk Image (.dmg)
        run: |
          set -e
          ln -fsn /Applications build/dmg_staging/Applications
          DMG_NAME="${APP_NAME}-${VERSION}-macOS-arm64.dmg"
          rm -f "build/${DMG_NAME}"
          hdiutil create \
            -volname "${DISPLAY_NAME}" \
            -srcfolder build/dmg_staging \
            -ov \
            -format UDZO \
            "build/${DMG_NAME}"
          ls -lh "build/${DMG_NAME}"

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: BlackMotif-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30

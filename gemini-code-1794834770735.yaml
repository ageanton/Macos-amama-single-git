              // MARK: - Tab 2: MEMORY (Unified Memory Spec Sheet with Dotted Watch Leaders)
              private var memoryLedgerContent: some View {
                  let snap = store.memorySnapshot
                  return ScrollView(.vertical, showsIndicators: true) {
                      VStack(alignment: .leading, spacing: 14) {
                          HStack {
                              Text("01 // UNIFIED MEMORY")
                                  .font(typo.mono(size: 9.5, weight: .semibold))
                                  .tracking(0.8)
                                  .foregroundColor(tokens.mutedText)
                              Spacer()
                              Text(String(format: "%.2f GB FREE", snap.headroomGB))
                                  .font(typo.mono(size: 10.5, weight: .bold))
                                  .foregroundColor(tokens.primaryText)
                          }

                          // Monochrome Segmented Memory Bar (`3pt` chamfer)
                          GeometryReader { geo in
                              let totalW = geo.size.width
                              let wWeights = max(0, CGFloat(snap.weightsFraction) * totalW)
                              let wTotal = max(4, CGFloat(snap.usageFraction) * totalW)

                              ZStack(alignment: .leading) {
                                  RoundedRectangle(cornerRadius: 2, style: .continuous)
                                      .fill(tokens.elevatedSurface)
                                      .frame(height: 6)

                                  RoundedRectangle(cornerRadius: 2, style: .continuous)
                                      .fill(tokens.secondaryText.opacity(0.40))
                                      .frame(width: min(totalW, wTotal), height: 6)

                                  if wWeights > 0 {
                                      RoundedRectangle(cornerRadius: 2, style: .continuous)
                                          .fill(tokens.accentAction)
                                          .frame(width: min(totalW, wWeights), height: 6)
                                  }
                              }
                          }
                          .frame(height: 6)

                          if snap.historySamplesGB.count > 2 {
                              GeometryReader { geo in
                                  let maxVal = max(snap.totalGB, 8.0)
                                  Path { path in
                                      for (idx, val) in snap.historySamplesGB.enumerated() {
                                          let x = geo.size.width * CGFloat(idx) / CGFloat(max(1, snap.historySamplesGB.count - 1))
                                          let y = geo.size.height * (1.0 - CGFloat(min(1.0, val / maxVal)))
                                          if idx == 0 { path.move(to: CGPoint(x: x, y: y)) }
                                          else { path.addLine(to: CGPoint(x: x, y: y)) }
                                      }
                                  }
                                  .stroke(tokens.primaryText.opacity(0.65), lineWidth: 1.0)
                              }
                              .frame(height: 24)
                          }

                          HairlineDivider(tokens: tokens)

                          VStack(spacing: 8) {
                              DottedSpecLeaderRow("Free Headroom", value: String(format: "%.2f GB", snap.headroomGB), tokens: tokens, typo: typo)
                              DottedSpecLeaderRow("Total RAM Used", value: String(format: "%.2f / %.0f GB", snap.usedGB, snap.totalGB), tokens: tokens, typo: typo)
                              if let model = store.activeModelDescriptor {
                                  DottedSpecLeaderRow("Target Model", value: model.formattedSize, tokens: tokens, typo: typo)
                              }
                              DottedSpecLeaderRow("Ollama Resident", value: String(format: "%.2f GB", snap.weightsGB), tokens: tokens, typo: typo)
                              DottedSpecLeaderRow("Load Delta", value: String(format: "%@%.2f GB", snap.activeRAMDeltaGB >= 0 ? "+" : "", snap.activeRAMDeltaGB), tokens: tokens, typo: typo)
                              DottedSpecLeaderRow("KV Cache (\(store.supervisor.kvCacheTypeEnv.rawValue.uppercased()))", value: String(format: "%.2f GB", snap.kvCacheGB), tokens: tokens, typo: typo)
                              DottedSpecLeaderRow("Metal Ceiling", value: String(format: "%.1f GB", snap.metalMaxGB), tokens: tokens, typo: typo)
                          }

                          if let session = store.activeSession {
                              HairlineDivider(tokens: tokens)

                              let usedTok = session.estimatedActiveTokens
                              let maxTok = max(1, session.parameters.numCtx)
                              let pct = Int(min(100.0, (Double(usedTok) / Double(maxTok)) * 100.0))
                              let thread = session.activeBranchThread

                              VStack(alignment: .leading, spacing: 8) {
                                  Text("02 // FOLIO CONTEXT")
                                      .font(typo.mono(size: 9.5, weight: .semibold))
                                      .tracking(0.8)
                                      .foregroundColor(tokens.mutedText)

                                  DottedSpecLeaderRow("Active Tokens", value: "\(usedTok) / \(maxTok) (\(pct)%)", tokens: tokens, typo: typo)

                                  HStack(spacing: 6) {
                                      ArchitecturalKeyButton("TRIM OLDEST", isDisabled: thread.isEmpty, tokens: tokens, typo: typo) {
                                          store.trimOldestTurnInActiveSession()
                                      }
                                      ArchitecturalKeyButton("SUMMARIZE", isDisabled: thread.isEmpty, tokens: tokens, typo: typo) {
                                          store.summarizeContextIntoNewBranch()
                                      }
                                  }
                              }
                          }

                          if let loaded = store.availableModels.first(where: { $0.residency == .activeInUnifiedRAM }) {
                              HairlineDivider(tokens: tokens)

                              VStack(alignment: .leading, spacing: 8) {
                                  Text("03 // RESIDENT WEIGHTS")
                                      .font(typo.mono(size: 9.5, weight: .semibold))
                                      .tracking(0.8)
                                      .foregroundColor(tokens.mutedText)

                                  HStack(spacing: 6) {
                                      ArchitecturalKeyButton("RESET KV", tokens: tokens, typo: typo) {
                                          store.clearActiveKVCacheInRAM()
                                      }
                                      ArchitecturalKeyButton("UNLOAD \(loaded.shortDisplayName.uppercased())", isPrimaryStamp: true, tokens: tokens, typo: typo) {
                                          Task { await store.unloadModelFromMemory(loaded) }
                                      }
                                  }
                              }
                          }
                      }
                      .padding(14)
                      .background(OverlayScrollConfigurator(isDark: tokens.isEffectivelyDark).frame(width: 1, height: 1))
                  }
              }

              // MARK: - Tab 3: CODE (Extracted Snippets Ledger)
              private var codeLedgerContent: some View {
                  let artifacts = store.activeSession?.artifacts ?? []
                  let currentArtifact: WorkspaceArtifact? = {
                      if let id = store.selectedArtifactID, let match = artifacts.first(where: { $0.id == id }) {
                          return match
                      }
                      return artifacts.first
                  }()

                  return VStack(alignment: .leading, spacing: 0) {
                      if let artifact = currentArtifact {
                          HStack(spacing: 6) {
                              ArchitecturalKeyButton("SAVE FILE…", tokens: tokens, typo: typo) {
                                  saveArtifactToDisk(artifact)
                              }
                              ArchitecturalKeyButton("OPEN EDITOR", tokens: tokens, typo: typo) {
                                  openArtifactInExternalEditor(artifact)
                              }
                              Spacer()
                          }
                          .padding(.horizontal, 12)
                          .padding(.vertical, 8)

                          HairlineDivider(tokens: tokens)

                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 4) {
                                  ForEach(artifacts) { item in
                                      let isSelected = item.id == artifact.id
                                      Button {
                                          store.selectedArtifactID = item.id
                                      } label: {
                                          Text(item.title)
                                              .font(typo.mono(size: 10, weight: isSelected ? .bold : .regular))
                                              .foregroundColor(isSelected ? tokens.accentForeground : tokens.primaryText)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 4)
                                              .background(
                                                  RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                                      .fill(isSelected ? tokens.accentAction : tokens.canvasBackground)
                                              )
                                              .overlay(
                                                  RoundedRectangle(cornerRadius: 2.5, style: .continuous)
                                                      .strokeBorder(tokens.hairline, lineWidth: 0.75)
                                              )
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                              .padding(.horizontal, 12)
                              .padding(.vertical, 7)
                          }

                          HairlineDivider(tokens: tokens)

                          ScrollView(.vertical, showsIndicators: true) {
                              MotifCodeBlockView(
                                  language: artifact.language,
                                  code: artifact.content,
                                  tokens: tokens,
                                  typo: typo,
                                  onOpenInArtifactPane: {}
                              )
                              .padding(12)
                              .background(OverlayScrollConfigurator(isDark: tokens.isEffectivelyDark).frame(width: 1, height: 1))
                          }
                      } else {
                          VStack(alignment: .leading, spacing: 6) {
                              Text("01 // CODE LEDGER")
                                  .font(typo.mono(size: 9.5, weight: .semibold))
                                  .tracking(0.8)
                                  .foregroundColor(tokens.mutedText)
                              Text("No fenced code blocks in this folio yet.")
                                  .font(typo.sans(size: 12))
                                  .foregroundColor(tokens.secondaryText)
                              Spacer()
                          }
                          .padding(14)
                      }
                  }
              }

              private func saveArtifactToDisk(_ artifact: WorkspaceArtifact) {
                  let panel = NSSavePanel()
                  panel.title = "Save Code Snippet"
                  let ext = artifact.language.isEmpty ? "txt" : artifact.language
                  panel.nameFieldStringValue = "\(artifact.title.replacingOccurrences(of: " ", with: "_")).\(ext)"
                  if panel.runModal() == .OK, let url = panel.url {
                      try? artifact.content.write(to: url, atomically: true, encoding: .utf8)
                  }
              }

              private func openArtifactInExternalEditor(_ artifact: WorkspaceArtifact) {
                  let ext = artifact.language.isEmpty ? "txt" : artifact.language
                  let tempURL = FileManager.default.temporaryDirectory.appendingPathComponent("BlackMotifSnippet.\(ext)")
                  try? artifact.content.write(to: tempURL, atomically: true, encoding: .utf8)
                  NSWorkspace.shared.open(tempURL)
              }
          }
          EOF

      - name: Generate In-Grid Settings Specification Page & Clean Dialog Sheets (UtilityAndModalViews.swift)

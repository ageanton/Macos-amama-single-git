                                              .buttonStyle(.plain)

                                              if idx < ctxChoices.count - 1 {
                                                  HairlineDivider(axis: .vertical, tokens: tokens)
                                                      .frame(height: 24)
                                              }
                                          }
                                      }
                                      .clipShape(RoundedRectangle(cornerRadius: 3, style: .continuous))
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 3, style: .continuous)

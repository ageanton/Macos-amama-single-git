                  ) { [weak self] _ in
                      Task { @MainActor in
                          self?.isWindowFullscreen = false
                          self?.isScrolledAwayFromBottom = false
                      }
                  }
                  let minObs = NotificationCenter.default.addObserver(
                      forName: NSWindow.didMiniaturizeNotification,

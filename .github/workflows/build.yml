                                      .font(typo.mono(size: 10.5, weight: .semibold))
                                      .foregroundColor(tokens.accentAction)
                                      .buttonStyle(.plain)
                                  }
                              }
                              .frame(width: 128, alignment: .leading)
                              .clipped()

                              VStack(alignment: .leading, spacing: 10) {
                                  turnMainBody(node: node, isNodeStreaming: isNodeStreaming, opticalFontSize: opticalFontSize)
                                  turnBottomActionBar(node: node, session: session, isLatestTurn: isLatestTurn, isNodeStreaming: isNodeStreaming)
                              }
                              .frame(maxWidth: .infinity, alignment: .leading)
                          }
                      } else {
                          HStack(alignment: .center, spacing: 8) {
                              turnRoleOrHotSwapMenu(node: node, maxLabelWidth: 210)

                              if siblingMeta.totalCount > 1 {
                                  branchPaginationControl(nodeID: node.id, siblingMeta: siblingMeta)
                              }

                              Spacer()

                              if isNodeStreaming {
                                  HStack(spacing: 10) {
                                      if store.liveTokensPerSec > 0 {
                                          Text(String(format: "%.1f tok/s · %d tok", store.liveTokensPerSec, store.liveTotalTokens))
                                              .font(typo.mono(size: 10.5))
                                              .foregroundColor(tokens.secondaryText)
                                      }
                                      Button("Stop") {
                                          store.stopActiveGeneration()
                                      }
                                      .font(typo.sans(size: 11.5, weight: .medium))
                                      .foregroundColor(tokens.accentAction)
                                      .buttonStyle(.plain)
                                  }
                              }
                          }

                          turnMainBody(node: node, isNodeStreaming: isNodeStreaming, opticalFontSize: opticalFontSize)
                          turnBottomActionBar(node: node, session: session, isLatestTurn: isLatestTurn, isNodeStreaming: isNodeStreaming)
                      }

                      HairlineDivider(tokens: tokens)
                          .padding(.top, 6)
                  }
                  .contextMenu {
                      Button("Copy Message") {
                          NSPasteboard.general.clearContents()
                          NSPasteboard.general.setString(node.content.isEmpty ? node.thinkingTrace : node.content, forType: .string)
                      }
                      Button(node.role == .user ? "Edit Prompt…" : "Edit / Trim Reply to Save KV RAM…") {
                          editMessageDraft = node.content
                          clearThinkingOnAssistantEdit = false
                          editingMessageNodeID = node.id
                      }
                      Button("Branch to New Chat from Here") {
                          store.branchMessageToNewChat(upToNodeID: node.id)
                      }
                      Divider()
                      Button("Delete Message (Free ~\(node.estimatedTokenFootprint) tokens)…", role: .destructive) {
                          confirmingDeleteNodeID = node.id
                      }
                  }
              }

              /// Uses tail-truncation and `maxWidth` instead of `.fixedSize()` so long model names NEVER bleed into the reply column!
              @ViewBuilder
              private func turnRoleOrHotSwapMenu(node: ConversationMessageNode, maxLabelWidth: CGFloat) -> some View {
                  if node.role == .user {
                      Text("You")
                          .font(typo.sans(size: 12, weight: .semibold))
                          .foregroundColor(tokens.primaryText)
                  } else {
                      let rawModel = node.modelUsed.isEmpty ? "Assistant" : node.modelUsed
                      let shortLabel = LocalModelDescriptor.shortenModelName(rawModel)

                      Menu {
                          Text("Regenerate turn with model:")
                          ForEach(store.availableModels) { model in
                              Button(model.displayName) {
                                  store.regenerateAssistantBranch(forAssistantNodeID: node.id, withOverrideModel: model.name)
                              }
                          }
                      } label: {
                          HStack(spacing: 4) {
                              Text(shortLabel)
                                  .font(typo.sans(size: 12, weight: .semibold))
                                  .foregroundColor(tokens.primaryText)
                                  .lineLimit(1)
                                  .truncationMode(.tail)
                              Image(systemName: "chevron.up.chevron.down")
                                  .font(.system(size: 8.5, weight: .semibold))
                                  .foregroundColor(tokens.mutedText)
                          }
                          .frame(maxWidth: maxLabelWidth, alignment: .leading)
                      }
                      .menuStyle(.borderlessButton)
                      .frame(maxWidth: maxLabelWidth, alignment: .leading)
                      .help("\(rawModel) — Click to hot-swap model and regenerate this reply")
                  }
              }

              private func branchPaginationControl(nodeID: UUID, siblingMeta: (currentIndex: Int, totalCount: Int)) -> some View {
                  HStack(spacing: 4) {
                      Button {
                          store.switchBranchVersion(forNodeID: nodeID, delta: -1)
                      } label: {
                          Image(systemName: "chevron.left").font(.system(size: 9, weight: .semibold))
                      }
                      .buttonStyle(.plain)
                      .disabled(siblingMeta.currentIndex == 0)

                      Text("\(siblingMeta.currentIndex + 1)/\(siblingMeta.totalCount)")
                          .font(typo.mono(size: 10.5))

                      Button {
                          store.switchBranchVersion(forNodeID: nodeID, delta: 1)
                      } label: {
                          Image(systemName: "chevron.right").font(.system(size: 9, weight: .semibold))
                      }
                      .buttonStyle(.plain)
                      .disabled(siblingMeta.currentIndex >= siblingMeta.totalCount - 1)
                  }
                  .foregroundColor(tokens.secondaryText)
              }

              @ViewBuilder
              private func turnMainBody(
                  node: ConversationMessageNode,
                  isNodeStreaming: Bool,
                  opticalFontSize: CGFloat
              ) -> some View {
                  if !node.attachments.isEmpty {
                      HStack(spacing: 8) {
                          ForEach(node.attachments) { att in
                              Text("\(att.title) (\(att.formattedByteSize) · ~\(att.tokenEstimate) tok)")
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.primaryText)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 4)
                                  .background(tokens.elevatedSurface)
                                  .clipShape(RoundedRectangle(cornerRadius: 5, style: .continuous))
                          }
                      }
                  }

                  if !node.thinkingTrace.isEmpty || (!node.isThinkingComplete && isNodeStreaming) {
                      thinkingDisclosureView(for: node, isStreaming: isNodeStreaming, opticalFontSize: opticalFontSize)
                  }

                  if editingMessageNodeID == node.id {
                      VStack(alignment: .leading, spacing: 8) {
                          TextEditor(text: $editMessageDraft)
                              .font(typo.sans(size: opticalFontSize))
                              .foregroundColor(tokens.primaryText)
                              .scrollContentBackground(.hidden)
                              .frame(minHeight: 84, maxHeight: 240)
                              .padding(8)
                              .background(tokens.elevatedSurface)
                              .clipShape(RoundedRectangle(cornerRadius: 6, style: .continuous))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 6, style: .continuous)
                                      .strokeBorder(tokens.strongBorder, lineWidth: 1)
                              )

                          HStack(spacing: 12) {
                              if node.role == .assistant {
                                  if !node.thinkingTrace.isEmpty {
                                      Toggle("Also clear thinking trace (~\(max(1, node.thinkingTrace.count / 4)) tok)", isOn: $clearThinkingOnAssistantEdit)
                                          .font(typo.sans(size: 11.5))
                                          .foregroundColor(tokens.secondaryText)
                                  }
                                  let oldTok = node.estimatedTokenFootprint
                                  let newTok = max(1, editMessageDraft.count / 4) + (clearThinkingOnAssistantEdit ? 0 : (node.thinkingTrace.count / 4))
                                  let savedTok = max(0, oldTok - newTok)
                                  if savedTok > 0 {
                                      Text("Saves ~\(savedTok) KV tokens")
                                          .font(typo.mono(size: 10.5, weight: .semibold))
                                          .foregroundColor(tokens.accentAction)
                                  }
                              }

                              Spacer()

                              Button("Cancel") {
                                  editingMessageNodeID = nil
                              }
                              .font(typo.sans(size: 12))
                              .foregroundColor(tokens.secondaryText)
                              .buttonStyle(.plain)

                              if node.role == .user {
                                  Button("Save & Resubmit") {
                                      let updated = editMessageDraft
                                      editingMessageNodeID = nil
                                      store.createEditedMessageBranch(originalNodeID: node.id, updatedText: updated)
                                  }
                                  .font(typo.sans(size: 12, weight: .semibold))
                                  .foregroundColor(tokens.accentForeground)
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 4)
                                  .background(RoundedRectangle(cornerRadius: 5, style: .continuous).fill(tokens.accentAction))
                                  .buttonStyle(.plain)
                              } else {
                                  Button("Save Trimmed Reply") {
                                      let updated = editMessageDraft
                                      let clearThink = clearThinkingOnAssistantEdit
                                      editingMessageNodeID = nil
                                      store.updateAssistantMessageInPlace(nodeID: node.id, updatedText: updated, clearThinking: clearThink)
                                  }
                                  .font(typo.sans(size: 12, weight: .semibold))
                                  .foregroundColor(tokens.accentForeground)
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 4)
                                  .background(RoundedRectangle(cornerRadius: 5, style: .continuous).fill(tokens.accentAction))
                                  .buttonStyle(.plain)
                              }
                          }
                      }
                  } else if node.content.isEmpty && isNodeStreaming {
                      if store.isLoadingModelWeights {
                          let snap = store.memorySnapshot
                          let pct = Int(snap.loadProgressAgainstTarget * 100.0)
                          Text(String(format: "Loading weights into Unified Memory (%.1f / %.1f GB · %d%%)…", max(snap.weightsGB, snap.activeRAMDeltaGB), max(0.1, snap.targetModelGB), pct))
                              .font(typo.mono(size: 11.5))
                              .foregroundColor(tokens.mutedText)
                      } else if node.thinkingTrace.isEmpty {
                          Text("Thinking…")
                              .font(typo.mono(size: 11.5))
                              .foregroundColor(tokens.mutedText)
                      }
                  } else if !node.content.isEmpty {
                      StreamSafeMarkdownView(
                          rawMarkdown: isNodeStreaming ? (node.content + " ▍") : node.content,
                          isStreaming: isNodeStreaming,
                          effectiveFontSize: opticalFontSize,
                          tokens: tokens,
                          typo: typo,
                          onOpenCodeInInspector: { _, _ in
                              store.userManuallyClosedRightPaneInWideMode = false
                              store.isRightUtilityPaneOpen = true
                          }
                      )
                  }

                  if let err = node.errorNote {
                      Text(err)
                          .font(typo.sans(size: 12.5))
                          .foregroundColor(.red)
                  }
              }

              // MARK: - Bottom Action Bar (Live tok/s While Typing, Edit on Both Roles, Continue Only on Latest Turn, Total Chat Tokens Only on Last Reply)
              @ViewBuilder
              private func turnBottomActionBar(
                  node: ConversationMessageNode,
                  session: ConversationSession,
                  isLatestTurn: Bool,
                  isNodeStreaming: Bool
              ) -> some View {
                  if isNodeStreaming {
                      HStack(spacing: 10) {
                          if store.liveTokensPerSec > 0 {
                              Text(String(format: "⚡ %.1f tok/s · %d tokens generated", store.liveTokensPerSec, store.liveTotalTokens))
                                  .font(typo.mono(size: 10.5, weight: .medium))
                                  .foregroundColor(tokens.secondaryText)
                          }
                          Spacer()
                      }
                      .padding(.top, 2)
                  } else {
                      HStack(spacing: 14) {
                          if confirmingDeleteNodeID == node.id {
                              HStack(spacing: 8) {
                                  Text("Delete turn & free ~\(node.estimatedTokenFootprint) tok?")
                                      .font(typo.mono(size: 10.5, weight: .semibold))
                                      .foregroundColor(tokens.primaryText)

                                  Button("Confirm Delete") {
                                      confirmingDeleteNodeID = nil
                                      store.deleteSingleMessageNode(node.id)
                                  }
                                  .font(typo.sans(size: 11, weight: .semibold))
                                  .foregroundColor(tokens.accentForeground)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 3)
                                  .background(RoundedRectangle(cornerRadius: 4, style: .continuous).fill(tokens.accentAction))
                                  .buttonStyle(.plain)

                                  Button("Cancel") {
                                      confirmingDeleteNodeID = nil
                                  }
                                  .font(typo.sans(size: 11))
                                  .foregroundColor(tokens.secondaryText)
                                  .buttonStyle(.plain)
                              }
                          } else {
                              Button {
                                  NSPasteboard.general.clearContents()
                                  NSPasteboard.general.setString(node.content.isEmpty ? node.thinkingTrace : node.content, forType: .string)
                                  copiedMessageID = node.id
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      if copiedMessageID == node.id { copiedMessageID = nil }
                                  }
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: copiedMessageID == node.id ? "checkmark" : "doc.on.doc")
                                          .font(.system(size: 10.5))
                                      Text(copiedMessageID == node.id ? "Copied" : "Copy")
                                          .font(typo.sans(size: 11.5, weight: .medium))
                                  }
                                  .foregroundColor(tokens.secondaryText)
                              }
                              .buttonStyle(.plain)

                              Button {
                                  editMessageDraft = node.content
                                  clearThinkingOnAssistantEdit = false
                                  editingMessageNodeID = node.id
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: "pencil")
                                          .font(.system(size: 10.5))
                                      Text("Edit")
                                          .font(typo.sans(size: 11.5, weight: .medium))
                                  }
                                  .foregroundColor(tokens.secondaryText)
                              }
                              .buttonStyle(.plain)
                              .help(node.role == .user ? "Edit prompt and branch" : "Edit or trim AI reply in-place to reduce KV cache tokens")

                              if node.role == .assistant {
                                  Button {
                                      store.regenerateAssistantBranch(forAssistantNodeID: node.id)
                                  } label: {
                                      HStack(spacing: 4) {
                                          Image(systemName: "arrow.clockwise")
                                              .font(.system(size: 10.5))
                                          Text("Regenerate")
                                              .font(typo.sans(size: 11.5, weight: .medium))
                                      }
                                      .foregroundColor(tokens.secondaryText)
                                  }
                                  .buttonStyle(.plain)

                                  // Only show "Continue" if this stopped reply is still the latest turn in the conversation
                                  if node.wasStoppedMidStream && isLatestTurn {
                                      Button {
                                          store.continueStoppedGeneration(forAssistantNodeID: node.id)
                                      } label: {
                                          HStack(spacing: 4) {
                                              Image(systemName: "play.fill")
                                                  .font(.system(size: 9.5))
                                              Text("Continue")
                                                  .font(typo.sans(size: 11.5, weight: .semibold))
                                          }
                                          .foregroundColor(tokens.accentForeground)
                                          .padding(.horizontal, 8)
                                          .padding(.vertical, 3)
                                          .background(RoundedRectangle(cornerRadius: 4, style: .continuous).fill(tokens.accentAction))
                                      }
                                      .buttonStyle(.plain)
                                      .help("Resume generation from where it was stopped")
                                  }
                              }

                              Button {
                                  store.branchMessageToNewChat(upToNodeID: node.id)
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: "arrow.triangle.branch")
                                          .font(.system(size: 10.5))
                                      Text("Branch to Chat")
                                          .font(typo.sans(size: 11.5, weight: .medium))
                                  }
                                  .foregroundColor(tokens.secondaryText)
                              }
                              .buttonStyle(.plain)
                              .help("Fork conversation up to this message into a new chat prefixed with 'Branch · '")

                              Button {
                                  confirmingDeleteNodeID = node.id
                              } label: {
                                  HStack(spacing: 3) {
                                      Image(systemName: "trash")
                                          .font(.system(size: 10))
                                      Text("Delete")
                                          .font(typo.sans(size: 11.5, weight: .medium))
                                  }
                                  .foregroundColor(tokens.mutedText)
                              }
                              .buttonStyle(.plain)
                              .help("Remove this message from context to reclaim ~\(node.estimatedTokenFootprint) tokens of KV RAM")
                          }

                          Spacer()

                          if node.role == .assistant, let metrics = node.metrics, metrics.tokensPerSecond > 0 {
                              if isLatestTurn {
                                  Text(String(format: "%.1f tok/s · %d tok · Chat Total: %d tok", metrics.tokensPerSecond, metrics.totalTokens, session.estimatedActiveTokens))
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.mutedText)
                              } else {
                                  Text(String(format: "%.1f tok/s · %d tok", metrics.tokensPerSecond, metrics.totalTokens))
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.mutedText)
                              }
                          }
                      }
                      .padding(.top, 2)
                  }
              }

              // MARK: - Thinking Disclosure (`THOUGHT PROCESS` Pill Header + Enclosed Light Box + Smaller Relative Monospace Font)
              @ViewBuilder
              private func thinkingDisclosureView(
                  for node: ConversationMessageNode,
                  isStreaming: Bool,
                  opticalFontSize: CGFloat
              ) -> some View {
                  let relativeThinkingFontSize = max(10.5, opticalFontSize - 2.4)
                  let headerMonoSize = max(10.0, opticalFontSize - 3.2)
                  let wordCount = max(1, node.thinkingTrace.split { $0.isWhitespace || $0.isNewline }.count)
                  let isActivelyThinking = !node.isThinkingComplete && isStreaming

                  VStack(alignment: .leading, spacing: 6) {
                      Button {
                          guard let sIdx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }),
                                var target = store.sessions[sIdx].nodes[node.id] else { return }
                          withAnimation(.easeOut(duration: 0.14)) {
                              target.isThinkingExpanded.toggle()
                              store.sessions[sIdx].nodes[node.id] = target
                          }
                      } label: {
                          HStack(spacing: 7) {
                              Circle()
                                  .fill(isActivelyThinking ? tokens.accentAction : tokens.mutedText.opacity(0.65))
                                  .frame(width: 5.5, height: 5.5)

                              Text(node.wasStoppedMidThinking ? "THOUGHT PROCESS · STOPPED" : (isActivelyThinking ? "THINKING LIVE" : "THOUGHT PROCESS"))
                                  .font(typo.mono(size: headerMonoSize, weight: .semibold))
                                  .tracking(0.6)
                                  .foregroundColor(tokens.secondaryText)

                              Text(node.isThinkingComplete
                                   ? String(format: "%.1fs", node.metrics?.thinkingDurationSec ?? 0.0)
                                   : String(format: "%.1fs…", store.liveElapsedSeconds))
                                  .font(typo.mono(size: headerMonoSize, weight: .medium))
                                  .foregroundColor(tokens.mutedText)

                              if !node.thinkingTrace.isEmpty {
                                  Text("· \(wordCount) \(wordCount == 1 ? "word" : "words")")
                                      .font(typo.mono(size: headerMonoSize))
                                      .foregroundColor(tokens.mutedText)
                              }

                              Image(systemName: "chevron.right")
                                  .font(.system(size: 8.5, weight: .bold))
                                  .foregroundColor(tokens.mutedText)
                                  .rotationEffect(.degrees(node.isThinkingExpanded ? 90 : 0))
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 5)
                          .background(tokens.elevatedSurface.opacity(0.75))
                          .clipShape(Capsule())
                          .overlay(
                              Capsule().strokeBorder(tokens.hairline, lineWidth: 1)
                          )
                      }
                      .buttonStyle(.plain)

                      if node.isThinkingExpanded {
                          Text(node.thinkingTrace.isEmpty ? "Reasoning…" : node.thinkingTrace)
                              .font(typo.mono(size: relativeThinkingFontSize, weight: .regular))
                              .lineSpacing(CGFloat(relativeThinkingFontSize * 0.34))
                              .foregroundColor(tokens.secondaryText)
                              .textSelection(.enabled)
                              .padding(12)
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .background(tokens.elevatedSurface)
                              .clipShape(RoundedRectangle(cornerRadius: 6, style: .continuous))
                      }
                  }
                  .padding(.bottom, 2)
              }
          }
          EOF

      - name: Generate Persistent Composer, Inline Memory Pill & Wrapping Presets Grid (ComposerAndInspectorViews.swift)
        run: |
          cat << 'EOF' > Motif/Sources/Motif/Views/ComposerAndInspectorViews.swift
          import SwiftUI
          import AppKit

          public struct ProgressiveComposerBar: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: MotifTokens
              public var maxBarWidth: CGFloat = 740.0
              public var activeFontSize: CGFloat = 14.0
              public var isWideOrFullscreen: Bool = false

              @State private var isComposerFocused: Bool = false
              @State private var compactEditorHeight: CGFloat = 28.0
              @State private var wrappedLineCount: Int = 1

              private var typo: TypographyConfiguration { store.typography }

              private var isSendEnabled: Bool {
                  store.isStreamingGeneration || store.sendDisabledReason == nil
              }

              private var matchingPersonas: [SlashPersona] {
                  store.matchedSlashPersonas
              }

              private var effectiveEditorHeight: CGFloat {
                  if store.isComposerCanvasExpanded {
                      return 240.0
                  }
                  return compactEditorHeight
              }

              private var adaptivePlaceholder: String {
                  if isWideOrFullscreen {
                      return "Message Motif…  (Type / for personas · Shift+Return for new line)"
                  } else {
                      return "Message Motif…  ( / for personas )"
                  }
              }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      // 1. Unclipped First-Class Floating Slash (`/`) Command Palette Card
                      if !matchingPersonas.isEmpty {
                          SlashPersonaCommandPaletteCard(
                              personas: matchingPersonas,
                              highlightedIndex: min(max(0, store.slashMenuHighlightedIndex), max(0, matchingPersonas.count - 1)),
                              tokens: tokens,
                              typo: typo,
                              onSelect: { persona in
                                  store.applySlashPersona(persona)
                              },
                              onManagePersonas: {
                                  store.isSlashMenuDismissedForCurrentToken = true
                                  store.settingsRequestedTab = "Slash Personas (/)"
                                  store.isSettingsModalPresented = true
                              },
                              onDismiss: {
                                  store.isSlashMenuDismissedForCurrentToken = true
                              }
                          )
                          .frame(maxWidth: min(maxBarWidth, 500))
                          .transition(.opacity.combined(with: .move(edge: .bottom)))
                      }

                      // 2. Main Composer Instrument (Single Persistent View Identity — Never Destroys NSTextView or Loses Focus!)
                      VStack(alignment: .leading, spacing: 0) {
                          if !store.pendingAttachments.isEmpty {
                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 8) {
                                      ForEach(store.pendingAttachments.indices, id: \.self) { idx in
                                          let chip = store.pendingAttachments[idx]
                                          HStack(spacing: 6) {
                                              Image(systemName: chip.kind == .downscaledVisionImage ? "photo" : "doc.text")
                                                  .font(.system(size: 10))
                                                  .foregroundColor(tokens.secondaryText)
                                              Text("\(chip.title) (\(chip.formattedByteSize) · ~\(chip.tokenEstimate) tok)")
                                                  .font(typo.mono(size: 10.5))
                                                  .foregroundColor(tokens.primaryText)
                                              Button {
                                                  store.pendingAttachments.remove(at: idx)
                                              } label: {
                                                  Image(systemName: "xmark")
                                                      .font(.system(size: 9, weight: .bold))
                                                      .foregroundColor(tokens.secondaryText)
                                              }
                                              .buttonStyle(.plain)
                                          }
                                          .padding(.horizontal, 8)
                                          .padding(.vertical, 4)
                                          .background(tokens.canvasBackground)
                                          .clipShape(RoundedRectangle(cornerRadius: 5, style: .continuous))
                                      }
                                  }
                                  .padding(.horizontal, 12)
                                  .padding(.top, 8)
                                  .padding(.bottom, 4)
                              }
                          }

                          // DECK A: Persistent Full-Width Prose Editor + Top-Right Expand/Contract Canvas Button
                          HStack(alignment: .top, spacing: 6) {
                              IMESafeComposerTextView(
                                  text: Binding(
                                      get: { store.composerDraft },
                                      set: { store.handleTextInputOrPaste($0) }
                                  ),
                                  isFocused: $isComposerFocused,
                                  compactHeight: $compactEditorHeight,
                                  lineCount: $wrappedLineCount,
                                  placeholder: adaptivePlaceholder,
                                  tokens: tokens,
                                  typo: typo,
                                  fontSize: activeFontSize,
                                  isSlashMenuVisible: !matchingPersonas.isEmpty,
                                  onSend: {
                                      if !store.isStreamingGeneration && store.sendDisabledReason == nil {
                                          store.sendActivePrompt()
                                      }
                                  },
                                  onSlashMoveUp: { store.moveSlashSelection(delta: -1) },
                                  onSlashMoveDown: { store.moveSlashSelection(delta: 1) },
                                  onSlashConfirm: { store.applyHighlightedSlashPersona() },
                                  onSlashDismiss: { store.isSlashMenuDismissedForCurrentToken = true },
                                  onLargePaste: { pasted in store.handleTextInputOrPaste(pasted) }
                              )
                              .frame(height: effectiveEditorHeight)

                              Button {
                                  withAnimation(.easeOut(duration: 0.16)) {
                                      store.isComposerCanvasExpanded.toggle()
                                  }
                              } label: {
                                  Image(systemName: store.isComposerCanvasExpanded
                                        ? "arrow.down.right.and.arrow.up.left"

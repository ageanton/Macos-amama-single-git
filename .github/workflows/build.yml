                              .foregroundColor(tokens.accentForeground)
                              .padding(.horizontal, 16)
                              .padding(.vertical, 6)
                              .background(RoundedRectangle(cornerRadius: 6, style: .continuous).fill(tokens.accentAction))
                              .buttonStyle(.plain)

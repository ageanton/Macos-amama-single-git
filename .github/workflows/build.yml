              }

              private var alabasterCanvasColorBinding: Binding<Color> {
                  Binding<Color>(
                      get: {
                          let c = store.customAlabaster
                          return Color(red: c.canvasRed, green: c.canvasGreen, blue: c.canvasBlue)
                      },
                      set: { newColor in
                          if let cg = NSColor(newColor).usingColorSpace(.sRGB) {
                              store.customAlabaster.isCustomCanvasEnabled = true
                              store.customAlabaster.canvasRed = Double(cg.redComponent)
                              store.customAlabaster.canvasGreen = Double(cg.greenComponent)
                              store.customAlabaster.canvasBlue = Double(cg.blueComponent)
                          }
                      }
                  )
              }


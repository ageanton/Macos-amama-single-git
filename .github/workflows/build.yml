                      set: { newColor in
                          if let cg = NSColor(newColor).usingColorSpace(.sRGB) {
                              store.customAlabaster.isCustomAccentEnabled = true
                              store.customAlabaster.accentRed = Double(cg.redComponent)
                              store.customAlabaster.accentGreen = Double(cg.greenComponent)
                              store.customAlabaster.accentBlue = Double(cg.blueComponent)
                          }
                      }
                  )
              }


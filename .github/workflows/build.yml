                              if self.isStreamingGeneration && !self.isScrolledAwayFromBottom {
                                  self.isScrolledAwayFromBottom = true
                              }
                          }
                      }
                      return event
                  }
              }

              private func startLiveTelemetryLoop() {
                  telemetryTimer = Timer.scheduledTimer(withTimeInterval: 0.30, repeats: true) { [weak self] _ in
